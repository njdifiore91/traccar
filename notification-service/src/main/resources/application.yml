# Notification Service Configuration

spring:
  application:
    name: notification-service
  
  # Message broker configuration
  cloud:
    stream:
      bindings:
        # Input channel for consuming events
        events-input:
          destination: events
          group: notification-service
          consumer:
            maxAttempts: 3
            backOffInitialInterval: 1000
            backOffMaxInterval: 10000
            backOffMultiplier: 2.0
        
        # Output channels for sending notifications
        email-out:
          destination: email-notifications
        sms-out:
          destination: sms-notifications
        push-out:
          destination: push-notifications
        web-out:
          destination: web-notifications
        notification-status:
          destination: notification-status
        dead-letter-queue:
          destination: notification-dlq
      
      # Default consumer properties
      default:
        consumer:
          headerMode: raw
      
      # Kafka binder configuration
      kafka:
        binder:
          brokers: ${KAFKA_BROKERS:localhost:9092}
          required-acks: 1
          auto-create-topics: true
          min-partition-count: 3
          replication-factor: 1
        bindings:
          events-input:
            consumer:
              enableDlq: true
              dlqName: events-dlq
              autoCommitOffset: false
              configuration:
                max.poll.records: 100
                session.timeout.ms: 15000
                max.poll.interval.ms: 300000
                key.deserializer: org.apache.kafka.common.serialization.StringDeserializer
                value.deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
                spring.json.trusted.packages: org.traccar.model,org.traccar.proto
  
  # Circuit breaker configuration
  circuitbreaker:
    resilience4j:
      instances:
        notificationDelivery:
          registerHealthIndicator: true
          slidingWindowSize: 100
          minimumNumberOfCalls: 10
          permittedNumberOfCallsInHalfOpenState: 5
          waitDurationInOpenState: 10s
          failureRateThreshold: 50
          slowCallRateThreshold: 30
          slowCallDurationThreshold: 5s

# Server configuration
server:
  port: ${PORT:8083}
  servlet:
    context-path: /

# Management endpoints configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,diskSpace,messageBroker,serviceDiscovery
        liveness:
          include: livenessState
  health:
    circuitbreakers:
      enabled: true
    binders:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    distribution:
      percentiles-histogram:
        http.server.requests: true

# Logging configuration
logging:
  level:
    root: INFO
    org.traccar: INFO
    org.springframework.cloud.stream: INFO
    org.springframework.kafka: INFO

# Distributed tracing configuration
spring.sleuth:
  sampler:
    probability: 1.0
  propagation:
    type: B3,W3C
  log:
    slf4j:
      enabled: true
  messaging:
    enabled: true
    kafka:
      enabled: true

# Zipkin configuration
spring.zipkin:
  enabled: true
  base-url: ${ZIPKIN_URL:http://localhost:9411}
  service:
    name: ${spring.application.name}

# Service discovery configuration
eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30
    metadata-map:
      startup: ${random.int}
      management.context-path: ${management.endpoints.web.base-path}

# Notification service specific configuration
notification:
  # Email configuration
  email:
    enabled: true
    from: ${EMAIL_FROM:notifications@traccar.org}
    smtp:
      host: ${SMTP_HOST:localhost}
      port: ${SMTP_PORT:25}
      username: ${SMTP_USERNAME:}
      password: ${SMTP_PASSWORD:}
      starttls: ${SMTP_STARTTLS:false}
      ssl: ${SMTP_SSL:false}
  
  # SMS configuration
  sms:
    enabled: ${SMS_ENABLED:false}
    provider: ${SMS_PROVIDER:http}
    http:
      url: ${SMS_HTTP_URL:}
      authorization: ${SMS_HTTP_AUTHORIZATION:}
    aws:
      region: ${SMS_AWS_REGION:us-east-1}
      access-key: ${SMS_AWS_ACCESS_KEY:}
      secret-key: ${SMS_AWS_SECRET_KEY:}
  
  # Push notification configuration
  push:
    enabled: ${PUSH_ENABLED:false}
    firebase:
      service-account-key: ${FIREBASE_SERVICE_ACCOUNT_KEY:}
  
  # Retry configuration
  retry:
    max-attempts: 3
    initial-interval: 1000
    multiplier: 2.0
    max-interval: 10000