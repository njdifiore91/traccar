// Root project build file for Traccar Microservices

buildscript {
    repositories {
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath "com.bmuschko:gradle-docker-plugin:9.4.0"
        classpath "com.google.cloud.tools:jib-gradle-plugin:3.4.1"
        classpath "org.springframework.boot:spring-boot-gradle-plugin:3.2.4"
    }
}

plugins {
    id "java"
    id "checkstyle"
    id "com.google.protobuf" version "0.9.4" apply false
    id "org.kordamp.gradle.project-enforcer" version "0.14.0"
    id "io.spring.dependency-management" version "1.1.4" apply false
    id "com.gorylenko.gradle-git-properties" version "2.4.1" apply false
}

// Define versions for all projects
ext {
    // Core dependencies
    guiceVersion = "7.0.0"
    jettyVersion = "11.0.24"
    jerseyVersion = "3.1.10"
    jacksonVersion = "2.18.2" // same version as jersey-media-json-jackson dependency
    protobufVersion = "4.29.3"
    jxlsVersion = "2.14.0" // version 3 has breaking changes
    junitVersion = "5.11.4"
    
    // Microservices dependencies
    grpcVersion = "1.61.0"
    kafkaVersion = "3.9.0"
    rabbitmqVersion = "5.24.0"
    consulVersion = "1.1.2"
    kubernetesClientVersion = "6.11.0"
    resilience4jVersion = "2.2.0"
    opentelemetryVersion = "1.31.0"
    micrometerVersion = "1.12.2"
    logbackVersion = "1.4.14"
    slf4jVersion = "2.0.12"
}

allprojects {
    repositories {
        mavenCentral()
    }
    
    apply plugin: "java"
    
    java {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    
    compileJava.options.encoding = "UTF-8"
}

// Configuration for all subprojects
subprojects {
    apply plugin: "checkstyle"
    apply plugin: "org.kordamp.gradle.project-enforcer"
    
    checkstyle {
        toolVersion = "10.21.1"
        configFile = file("${rootDir}/gradle/checkstyle.xml")
        checkstyleTest.enabled = false
    }
    
    enforce {
        // noinspection UnnecessaryQualifiedReference
        rule(enforcer.rules.EnforceBytecodeVersion) { r ->
            r.maxJdkVersion = "17"
        }
    }
    
    dependencies {
        // Common test dependencies for all projects
        testImplementation "org.junit.jupiter:junit-jupiter-api:${ext.junitVersion}"
        testImplementation "org.junit.jupiter:junit-jupiter-engine:${ext.junitVersion}"
        testImplementation "org.mockito:mockito-core:5.15.2"
    }
    
    test {
        useJUnitPlatform()
    }
}

// Configuration for all service projects (excludes common library)
configure(subprojects.findAll { it.name != 'common' }) {
    apply plugin: "com.google.protobuf"
    apply plugin: "com.gorylenko.gradle-git-properties"
    apply plugin: "com.bmuschko.docker-java-application"
    
    dependencies {
        // Common dependencies for all services
        implementation project(':common')
        
        // Logging framework
        implementation "org.slf4j:slf4j-api:${ext.slf4jVersion}"
        implementation "ch.qos.logback:logback-classic:${ext.logbackVersion}"
        implementation "ch.qos.logback:logback-core:${ext.logbackVersion}"
        implementation "net.logstash.logback:logstash-logback-encoder:7.4"
        
        // Message broker clients
        implementation "org.apache.kafka:kafka-clients:${ext.kafkaVersion}"
        implementation "com.rabbitmq:amqp-client:${ext.rabbitmqVersion}"
        
        // Service discovery
        implementation "com.orbitz.consul:consul-client:${ext.consulVersion}"
        implementation "io.fabric8:kubernetes-client:${ext.kubernetesClientVersion}"
        
        // Resilience patterns
        implementation "io.github.resilience4j:resilience4j-circuitbreaker:${ext.resilience4jVersion}"
        implementation "io.github.resilience4j:resilience4j-retry:${ext.resilience4jVersion}"
        implementation "io.github.resilience4j:resilience4j-ratelimiter:${ext.resilience4jVersion}"
        
        // Distributed tracing
        implementation "io.opentelemetry:opentelemetry-api:${ext.opentelemetryVersion}"
        implementation "io.opentelemetry:opentelemetry-sdk:${ext.opentelemetryVersion}"
        implementation "io.opentelemetry:opentelemetry-exporter-otlp:${ext.opentelemetryVersion}"
        implementation "io.opentelemetry:opentelemetry-semconv:${ext.opentelemetryVersion}-alpha"
        
        // Metrics
        implementation "io.micrometer:micrometer-core:${ext.micrometerVersion}"
        implementation "io.micrometer:micrometer-registry-prometheus:${ext.micrometerVersion}"
    }
    
    protobuf {
        protoc {
            artifact = "com.google.protobuf:protoc:${ext.protobufVersion}"
        }
        plugins {
            grpc {
                artifact = "io.grpc:protoc-gen-grpc-java:${ext.grpcVersion}"
            }
        }
        generateProtoTasks {
            all()*.plugins {
                grpc {}
            }
        }
    }
    
    // Docker configuration
    docker {
        javaApplication {
            baseImage = 'eclipse-temurin:17-jre-alpine'
            maintainer = 'Traccar Team "support@traccar.org"'
            ports = [8082]
            jvmArgs = ['-Xms256m', '-Xmx1g']
        }
    }
}

// Root project doesn't produce a JAR
jar.enabled = false

// Define subprojects
project(':common') {
    description = 'Traccar Common Library'
    
    dependencies {
        // Core dependencies
        api "com.google.inject:guice:${ext.guiceVersion}"
        api "com.fasterxml.jackson.core:jackson-databind:${ext.jacksonVersion}"
        api "com.google.protobuf:protobuf-java:${ext.protobufVersion}"
        api "io.grpc:grpc-protobuf:${ext.grpcVersion}"
        api "io.grpc:grpc-stub:${ext.grpcVersion}"
        
        // Utilities
        implementation "org.apache.commons:commons-lang3:3.14.0"
        implementation "org.apache.commons:commons-collections4:4.4"
        implementation "commons-codec:commons-codec:1.17.2"
        
        // Validation
        implementation "jakarta.validation:jakarta.validation-api:3.0.2"
    }
}

project(':protocol-service') {
    description = 'Traccar Protocol Service'
    
    dependencies {
        // Netty for network communication
        implementation "io.netty:netty-all:4.1.116.Final"
        
        // gRPC for service communication
        implementation "io.grpc:grpc-netty-shaded:${ext.grpcVersion}"
        implementation "io.grpc:grpc-protobuf:${ext.grpcVersion}"
        implementation "io.grpc:grpc-stub:${ext.grpcVersion}"
    }
}

project(':position-service') {
    description = 'Traccar Position Processing Service'
    
    dependencies {
        // Geospatial libraries
        implementation "org.locationtech.spatial4j:spatial4j:0.8"
        implementation "org.locationtech.jts:jts-core:1.20.0"
        implementation "com.google.openlocationcode:openlocationcode:1.0.4"
    }
}

project(':event-service') {
    description = 'Traccar Event Processing Service'
    
    dependencies {
        // Event processing dependencies
        implementation "org.apache.commons:commons-jexl3:3.4.0"
    }
}

project(':notification-service') {
    description = 'Traccar Notification Service'
    
    dependencies {
        // Notification channel dependencies
        implementation "com.sun.mail:jakarta.mail:2.0.1"
        implementation "com.amazonaws:aws-java-sdk-sns:1.12.780"
        implementation "com.google.firebase:firebase-admin:9.4.3"
        
        // Template engines
        implementation "org.apache.velocity:velocity-engine-core:2.4.1"
        implementation "org.apache.velocity.tools:velocity-tools-generic:3.1"
    }
}

project(':api-gateway') {
    description = 'Traccar API Gateway Service'
    
    dependencies {
        // Web server
        implementation "org.eclipse.jetty:jetty-server:${ext.jettyVersion}"
        implementation "org.eclipse.jetty:jetty-servlet:${ext.jettyVersion}"
        implementation "org.eclipse.jetty:jetty-servlets:${ext.jettyVersion}"
        implementation "org.eclipse.jetty:jetty-webapp:${ext.jettyVersion}"
        implementation "org.eclipse.jetty:jetty-jndi:${ext.jettyVersion}"
        implementation "org.eclipse.jetty:jetty-proxy:${ext.jettyVersion}"
        implementation "org.eclipse.jetty.websocket:websocket-jetty-server:${ext.jettyVersion}"
        
        // REST API
        implementation "org.glassfish.jersey.containers:jersey-container-servlet:${ext.jerseyVersion}"
        implementation "org.glassfish.jersey.media:jersey-media-json-jackson:${ext.jerseyVersion}"
        implementation "org.glassfish.jersey.inject:jersey-hk2:${ext.jerseyVersion}"
        implementation "org.glassfish.hk2:guice-bridge:3.1.1"
        implementation "com.fasterxml.jackson.jaxrs:jackson-jaxrs-json-provider:${ext.jacksonVersion}"
        
        // Authentication
        implementation "com.nimbusds:oauth2-oidc-sdk:11.20.2"
        implementation "com.warrenstrange:googleauth:1.5.0"
    }
}

project(':reporting-service') {
    description = 'Traccar Reporting Service'
    
    dependencies {
        // Reporting dependencies
        implementation "org.jxls:jxls:${ext.jxlsVersion}"
        implementation "org.jxls:jxls-poi:${ext.jxlsVersion}"
        implementation "org.mnode.ical4j:ical4j:4.0.8"
    }
}

// Database dependencies for services that need direct database access
configure(subprojects.findAll { it.name in ['api-gateway', 'reporting-service'] }) {
    dependencies {
        // Database dependencies
        implementation "com.h2database:h2:2.3.232"
        implementation "com.mysql:mysql-connector-j:9.1.0"
        implementation "org.mariadb.jdbc:mariadb-java-client:3.5.1"
        implementation "org.postgresql:postgresql:42.7.4"
        implementation "com.microsoft.sqlserver:mssql-jdbc:12.8.1.jre11"
        implementation "com.zaxxer:HikariCP:6.2.1"
        implementation "org.liquibase:liquibase-core:4.23.2"
    }
}