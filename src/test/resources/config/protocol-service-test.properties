# Protocol Service Test Configuration
# This file contains test-specific configuration for the Protocol Service

# Network Settings
protocol.port.tcp=5001-5100
protocol.port.udp=5101-5200
protocol.port.http=8001-8100
protocol.connection.timeout=15000
protocol.socket.timeout=5000
protocol.connection.backlog=10

# Buffer Settings
protocol.buffer.size=1024
protocol.buffer.max=4096
protocol.buffer.channel.initial=512
protocol.buffer.channel.max=2048

# Protocol Decoder/Encoder Settings
protocol.message.length.max=8192
protocol.frame.length.max=4096
protocol.frame.delimiter.hex=0D0A
protocol.frame.end.hex=0D0A

# Protocol Timeouts
protocol.timeout.idle=60000
protocol.timeout.response=15000
protocol.timeout.keepalive=300000

# Mock Device Settings
test.device.id=1
test.device.uniqueid=123456789012345
test.device.protocol=default
test.device.phone=5551234567
test.device.category=vehicle

# Mock Connection Settings
test.connection.remote.address=127.0.0.1
test.connection.local.address=127.0.0.1
test.connection.channel.active=true

# Protocol-Specific Test Parameters
# Teltonika
teltonika.test.codec.id=8
teltonika.test.server.port=5027
teltonika.test.buffer.size=2048

# TK103
