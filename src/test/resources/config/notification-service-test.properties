# Notification Service Test Configuration
# This file contains test-specific configuration for the Notification Service

# General notification settings
notification.enabled=true
notification.async=true
notification.test.mode=true

# Email notification settings for testing
notification.email.enabled=true
notification.email.from=test@traccar.org
notification.email.smtp.host=localhost
notification.email.smtp.port=3025
notification.email.smtp.starttls.enable=false
notification.email.smtp.ssl.enable=false
notification.email.smtp.username=test
notification.email.smtp.password=test
notification.email.smtp.auth=false
notification.email.smtp.timeout=10000
notification.email.smtp.connectiontimeout=10000

# SMS notification settings for testing
notification.sms.enabled=true
notification.sms.provider=mock
notification.sms.mock.endpoint=http://localhost:3026/sms
notification.sms.mock.authorization=test-auth-token

# Push notification settings for testing
notification.push.enabled=true
notification.push.provider=mock
notification.push.mock.endpoint=http://localhost:3027/push
notification.push.fcm.key=test-fcm-key
notification.push.fcm.url=http://localhost:3027/fcm

# Notification template settings
notification.template.engine=freemarker
notification.template.path=classpath:templates/test
notification.template.cache=false
notification.template.default.locale=en

# Notification throttling and batching parameters
notification.throttling.enabled=true
notification.throttling.interval=10
notification.throttling.limit=5
notification.batching.enabled=true
notification.batching.interval=30
notification.batching.max.size=10

# Notification delivery retry settings
notification.retry.enabled=true
notification.retry.attempts=3
notification.retry.initial.interval=1000
notification.retry.multiplier=2.0
notification.retry.max.interval=10000

# Notification channel priorities (higher number = higher priority)
notification.priority.email=1
notification.priority.sms=2
notification.priority.push=3

# Notification test endpoints
notification.test.webhook.endpoint=http://localhost:3028/webhook
notification.test.webhook.timeout=5000

# Notification service discovery settings for tests
notification.service.discovery.enabled=true
notification.service.discovery.provider=mock
notification.service.discovery.mock.endpoint=http://localhost:8500

# Notification message broker settings for tests
notification.message.broker.enabled=true
notification.message.broker.provider=mock
notification.message.broker.mock.endpoint=http://localhost:5672
notification.message.broker.queue=test-notification-queue
notification.message.broker.exchange=test-notification-exchange
notification.message.broker.routing.key=test-notification

# Notification database settings for tests
notification.database.url=jdbc:h2:mem:notification-test;DB_CLOSE_DELAY=-1
notification.database.username=sa
notification.database.password=
notification.database.driver=org.h2.Driver

# Notification test data settings
notification.test.data.devices=10
notification.test.data.users=5
notification.test.data.geofences=3
notification.test.data.events=20