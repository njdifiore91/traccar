# Test Environment Configuration
# This file contains environment-specific configuration properties for different test environments
# (local, CI, staging) as specified in section 0.2.5 of the technical specification.

# Environment Detection
# Auto-detects the current test environment based on environment variables
# If TEST_ENV is not set, defaults to 'local'
test.environment=${TEST_ENV:local}

# Common Test Settings (applied to all environments)
# These settings ensure tests don't affect production systems as specified in section 6.6.1.2
test.isolated=true
test.data.cleanup=true
test.mock.external.services=true

# Database Configuration
# Connection strings for test databases that vary across environments
database.driver=org.h2.Driver
database.url.local=jdbc:h2:mem:traccar;DB_CLOSE_DELAY=-1;MODE=MySQL
database.url.ci=jdbc:h2:mem:traccar;DB_CLOSE_DELAY=-1;MODE=MySQL
database.url.staging=jdbc:postgresql://staging-db:5432/traccar_test
database.username.local=sa
database.username.ci=sa
database.username.staging=traccar_test
database.password.local=
database.password.ci=
database.password.staging=test_password

# Message Broker Configuration
# Settings for test message brokers in different environments
message.broker.type=kafka
message.broker.host.local=localhost
message.broker.host.ci=kafka
message.broker.host.staging=staging-kafka.traccar.org
message.broker.port.local=9092
message.broker.port.ci=9092
message.broker.port.staging=9092

# Service Discovery Configuration
# Settings for test service discovery in different environments
service.discovery.type=consul
service.discovery.host.local=localhost
service.discovery.host.ci=consul
service.discovery.host.staging=staging-consul.traccar.org
service.discovery.port.local=8500
service.discovery.port.ci=8500
service.discovery.port.staging=8500

# API Gateway Configuration
# Settings for test API gateway in different environments
api.gateway.url.local=http://localhost:8082
api.gateway.url.ci=http://api-gateway:8082
api.gateway.url.staging=https://staging-api.traccar.org

# Protocol Service Configuration
# Settings for test protocol service in different environments
protocol.service.host.local=localhost
protocol.service.host.ci=protocol-service
protocol.service.host.staging=staging-protocol.traccar.org
protocol.service.port.local=8081
protocol.service.port.ci=8081
protocol.service.port.staging=8081

# Position Service Configuration
# Settings for test position service in different environments
position.service.host.local=localhost
position.service.host.ci=position-service
position.service.host.staging=staging-position.traccar.org
position.service.port.local=8083
position.service.port.ci=8083
position.service.port.staging=8083

# Event Service Configuration
# Settings for test event service in different environments
event.service.host.local=localhost
event.service.host.ci=event-service
event.service.host.staging=staging-event.traccar.org
event.service.port.local=8084
event.service.port.ci=8084
event.service.port.staging=8084

# Notification Service Configuration
# Settings for test notification service in different environments
notification.service.host.local=localhost
notification.service.host.ci=notification-service
notification.service.host.staging=staging-notification.traccar.org
notification.service.port.local=8085
notification.service.port.ci=8085
notification.service.port.staging=8085

# Reporting Service Configuration
# Settings for test reporting service in different environments
reporting.service.host.local=localhost
reporting.service.host.ci=reporting-service
reporting.service.host.staging=staging-reporting.traccar.org
reporting.service.port.local=8086
reporting.service.port.ci=8086
reporting.service.port.staging=8086

# Test Data Configuration
# Settings for test data generation and management
test.data.devices.count=10
test.data.positions.per.device=100
test.data.events.per.device=20
test.data.geofences.count=5
test.data.notifications.count=10

# Test Timeouts and Intervals
# Settings for test execution timeouts and intervals
test.timeout.default=30000
test.timeout.integration=60000
test.timeout.e2e=120000
test.interval.position=1000
test.interval.event=2000
test.interval.notification=3000

# Mock External Services
# Configuration for mock external services used in tests
test.mock.geocoder.url.local=http://localhost:9001
test.mock.geocoder.url.ci=http://mock-geocoder:9001
test.mock.geocoder.url.staging=http://staging-mock-geocoder.traccar.org:9001

test.mock.speedlimit.url.local=http://localhost:9002
test.mock.speedlimit.url.ci=http://mock-speedlimit:9002
test.mock.speedlimit.url.staging=http://staging-mock-speedlimit.traccar.org:9002

test.mock.map.url.local=http://localhost:9003
test.mock.map.url.ci=http://mock-map:9003
test.mock.map.url.staging=http://staging-mock-map.traccar.org:9003

# Test Feature Flags
# Flags to enable/disable specific test features
test.feature.websocket=true
test.feature.realtime.updates=true
test.feature.reports=true
test.feature.geofences=true
test.feature.notifications=true
test.feature.commands=true

# Test Logging Configuration
# Settings for test logging
test.logging.level=INFO
test.logging.console=true
test.logging.file=false
test.logging.file.path=logs/test.log

# Test Metrics Collection
# Settings for test metrics collection
test.metrics.enabled=true
test.metrics.console=true
test.metrics.prometheus=false
test.metrics.prometheus.port=9090

# Test Container Configuration
# Settings for test containers
test.containers.reuse=true
test.containers.remove=true
test.containers.network=traccar-test-network