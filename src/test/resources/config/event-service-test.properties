# Event Service Test Configuration
# This file contains test-specific configuration for the Event Service

# ----------------------------------------
# Event Detection Thresholds
# ----------------------------------------

# Motion event detection thresholds
motion.speedThreshold=0.01
motion.processInvalidPositions=false
motion.minimalTripDistance=500
motion.minimalTripDuration=300000
motion.minimalParkingDuration=300000
motion.minimalNoDataDuration=3600000
motion.useIgnition=false

# Overspeed event detection thresholds
overspeed.minimalDuration=15000
overspeed.preferLowest=true
overspeed.speedMultiplier=1.0
overspeed.globalSpeedLimit=90

# Geofence event detection parameters
geofence.minimalDuration=30000
geofence.processInvalidPositions=false

# ----------------------------------------
# Event Processing Parameters
# ----------------------------------------

# Event processing configuration
event.processingEnabled=true
event.forwardingEnabled=true
event.throttlingEnabled=false
event.throttlingRate=5

# Event filtering parameters
event.filter.skipDuplicates=true
event.filter.skipExpired=true
event.filter.expirationTime=86400000

# ----------------------------------------
# Event Notification Trigger Settings
# ----------------------------------------

# Notification trigger configuration
notification.enabled=true
notification.async=true
notification.throttlingEnabled=false
notification.throttlingRate=10

# Event types to trigger notifications for testing
notification.types.device=deviceOnline,deviceOffline,deviceUnknown,deviceMoving,deviceStopped
notification.types.position=alarm,ignitionOn,ignitionOff
notification.types.maintenance=maintenance,serviceExpired
notification.types.geofence=geofenceEnter,geofenceExit
notification.types.driver=driverChanged
notification.types.command=commandResult

# ----------------------------------------
# Test-Specific Settings
# ----------------------------------------

# Test mode settings
test.mode=true
test.skipActualNotifications=true
test.mockExternalServices=true

# Test data settings
test.defaultDeviceId=1
test.defaultGeofenceId=1
test.defaultUserId=1

# Test timeouts
test.timeout.short=1000
test.timeout.medium=5000
test.timeout.long=30000