# Position Service Test Configuration
# This file contains test-specific configuration for the Position Service

# General test settings
test.mode=true
test.isolated=true

# Database configuration for tests
database.driver=org.h2.Driver
database.url=jdbc:h2:mem:traccar;DB_CLOSE_DELAY=-1;MODE=MySQL
database.user=sa
database.password=

# Position processing parameters
processing.enable=true
processing.remoteAddress.enable=true
processing.copyAttributes.enable=true
processing.computedAttributes.enable=true

# Position filtering parameters
filter.enable=true
filter.invalid=true
filter.zero=true
filter.duplicate=true
filter.future=300
filter.approximate=true
filter.static=true
filter.distance=10
filter.maxSpeed=500
filter.skipLimit=10
filter.skipAttributes.enable=true
filter.skipAttributes=alarm,result

# Distance calculation parameters
distance.enable=true
distance.ignoreOdometer=false

# Geocoding settings for position enrichment tests
geocoder.enable=true
geocoder.type=test
geocoder.url=http://localhost:8082
geocoder.format=json
geocoder.cacheSize=100
geocoder.processInvalidPositions=false

# Geolocation settings
geolocation.enable=true
geolocation.type=test
geolocation.url=http://localhost:8083

# Speed limit provider settings
speedlimit.enable=true
speedlimit.type=test
speedlimit.url=http://localhost:8084

# Position attribute processing settings
attributes.process.enable=true
attributes.process.engineTemp=true
attributes.process.fuel=true
attributes.process.batteryLevel=true
attributes.process.motion=true

# Trip calculation parameters for testing
trip.minimalTripDistance=500
trip.minimalTripDuration=300
trip.minimalParkingDuration=300
trip.minimalNoDataDuration=3600

# Test-specific timeouts (in seconds)
timeout.geocoding=2
timeout.geolocation=2
timeout.speedlimit=2

# Test-specific message broker settings
message.broker.type=test
message.broker.url=memory://test

# Test-specific service discovery settings
service.discovery.type=test
service.discovery.url=memory://test