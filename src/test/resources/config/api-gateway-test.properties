# API Gateway Test Configuration
# This file contains configuration properties for API Gateway tests

# Server Configuration
server.port=8082
server.servlet.context-path=/api
server.compression.enabled=true

# API Endpoint Settings
api.version=1.0
api.base-path=/v1
api.protocol=http
api.host=localhost
api.port=8082

# Authentication and Authorization
api.security.enabled=true
api.security.jwt.secret=test-jwt-secret-key-for-testing-only
api.security.jwt.expiration=3600
api.security.basic.enabled=true
api.security.basic.username=test-user
api.security.basic.password=test-password
api.security.cors.enabled=true
api.security.cors.allowed-origins=*
api.security.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
api.security.cors.allowed-headers=Authorization,Content-Type,X-Requested-With

# API Rate Limiting and Throttling
api.rate-limit.enabled=true
api.rate-limit.requests-per-second=100
api.rate-limit.burst=20
api.rate-limit.timeout-ms=1000

# WebSocket Connection Settings
websocket.enabled=true
websocket.endpoint=/socket
websocket.allowed-origins=*
websocket.message-size-limit=65536
websocket.send-buffer-size-limit=512000
websocket.send-time-limit=10000

# Service Discovery for Testing
service-discovery.enabled=false
service-discovery.test-mode=true
service-discovery.static-services.protocol-service=http://localhost:8083
service-discovery.static-services.position-service=http://localhost:8084
service-discovery.static-services.event-service=http://localhost:8085
service-discovery.static-services.notification-service=http://localhost:8086
service-discovery.static-services.reporting-service=http://localhost:8087

# Mock Service Configuration
mock.enabled=true
mock.protocol-service.enabled=true
mock.position-service.enabled=true
mock.event-service.enabled=true
mock.notification-service.enabled=true
mock.reporting-service.enabled=true

# Database Configuration for Tests
database.jndi.enabled=false
database.driver=org.h2.Driver
database.url=jdbc:h2:mem:traccar-test;DB_CLOSE_DELAY=-1;MODE=MySQL
database.username=sa
database.password=
database.check-connection=true
database.max-pool-size=10

# Logging Configuration for Tests
logger.console=true
logger.file=false
logger.level=INFO
logger.queries=false

# Test-specific settings
test.skip-authentication=false
test.mock-external-services=true
test.use-test-containers=true