###############################################################################
# Feature Flags Configuration for Testing Environment
#
# This file contains feature flag configurations used during test execution.
# These settings are isolated from production systems as specified in section 6.6.1.2.
###############################################################################

#---------------------------------------
# Experimental Features
# Enable/disable experimental features during testing
#---------------------------------------

# Enable experimental protocol optimizations
experimental.protocol.optimization=true

# Enable experimental position processing pipeline
experimental.position.pipeline=true

# Enable experimental event detection algorithms
experimental.event.detection=true

# Enable experimental notification delivery mechanisms
experimental.notification.delivery=true

# Enable experimental database query optimizations
experimental.database.optimization=true

# Enable experimental API features
experimental.api.features=true

#---------------------------------------
# Implementation Strategy Selection
# Flags to select between different implementation approaches
#---------------------------------------

# Select position processing strategy (options: default, optimized, legacy)
strategy.position.processing=optimized

# Select event detection strategy (options: default, predictive, legacy)
strategy.event.detection=predictive

# Select notification delivery strategy (options: default, batched, immediate)
strategy.notification.delivery=batched

# Select database access strategy (options: default, cached, direct)
strategy.database.access=cached

# Select authentication strategy (options: default, token-based, session-based)
strategy.authentication=token-based

# Select protocol decoder strategy (options: default, optimized, legacy)
strategy.protocol.decoder=optimized

#---------------------------------------
# Feature-specific Parameters
# Configuration values for specific features
#---------------------------------------

# Geofence calculation precision (higher values = more precise but slower)
feature.geofence.precision=5

# Maximum number of positions to process in a batch
feature.position.batch.size=100

# Event processing thread pool size
feature.event.thread.pool.size=10

# Notification retry attempts
feature.notification.retry.count=3

# Notification retry delay in milliseconds
feature.notification.retry.delay=1000

# Position history retention period in days
feature.position.retention.days=30

# Enable detailed debug logging for tests
feature.debug.logging=true

# Enable mock external services for testing
feature.mock.external.services=true

#---------------------------------------
# Gradual Rollout Simulation
# Settings to simulate gradual feature rollout
#---------------------------------------

# Percentage of requests to route to new implementation (0-100)
rollout.new.implementation.percentage=50

# Device IDs to include in feature testing (comma-separated list)
rollout.test.device.ids=1,2,3,4,5

# User IDs to include in feature testing (comma-separated list)
rollout.test.user.ids=1,2,3

# Enable A/B testing mode
rollout.ab.testing.enabled=true

# A/B testing group assignment seed (for reproducible test runs)
rollout.ab.testing.seed=12345

#---------------------------------------
# Test-specific Toggles
# Flags specifically for test execution control
#---------------------------------------

# Skip time-consuming tests
test.skip.long.running=false

# Simulate slow network conditions
test.simulate.network.latency=false

# Network latency in milliseconds (when simulation is enabled)
test.network.latency.ms=100

# Simulate service failures
test.simulate.service.failures=false

# Failure rate percentage (when simulation is enabled)
test.service.failure.rate=10

# Enable test data generation
test.generate.test.data=true

# Number of test entities to generate
test.generated.entity.count=50