# Reporting Service Test Configuration
# This file contains test-specific configuration for the Reporting Service

# =============================================================================
# DATABASE CONFIGURATION
# =============================================================================

# Use in-memory H2 database for testing
database.driver=org.h2.Driver
database.url=jdbc:h2:mem:traccar-test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
database.user=sa
database.password=

# =============================================================================
# REPORT TEMPLATE SETTINGS
# =============================================================================

# Base directory for report templates (relative to classpath)
report.templates.path=templates/reports

# Default template engine (velocity)
report.template.engine=velocity

# Template file extensions
report.template.extension.html=vm
report.template.extension.pdf=vm
report.template.extension.excel=vm

# Test templates
report.template.route=route-test.vm
report.template.events=events-test.vm
report.template.summary=summary-test.vm
report.template.trips=trips-test.vm
report.template.stops=stops-test.vm
report.template.daily=daily-test.vm

# =============================================================================
# DATA AGGREGATION PARAMETERS
# =============================================================================

# Default time ranges for testing
report.test.period.day=86400
report.test.period.week=604800
report.test.period.month=2592000

# Maximum number of items per report for testing
report.test.limit.events=1000
report.test.limit.positions=5000

# Data aggregation intervals (in seconds)
report.aggregation.interval.daily=86400
report.aggregation.interval.hourly=3600
report.aggregation.interval.minutes=60

# Position filtering for reports
report.position.filter.invalid=true
report.position.filter.duplicate=true
report.position.filter.accuracy=100
report.position.filter.approximate=false

# =============================================================================
# CALCULATION PARAMETERS
# =============================================================================

# Trip detection parameters
report.trip.minimal.trip.distance=500
report.trip.minimal.trip.duration=300
report.trip.minimal.parking.duration=180
report.trip.minimal.no.data.duration=900
report.trip.use.ignition=false

# Speed calculation
report.speed.ignore.odometer=true
report.speed.use.average=false

# Distance calculation
report.distance.use.odometer=false
report.distance.use.calculated=true

# Fuel calculation
report.fuel.use.consumption.data=true
report.fuel.consumption.threshold=0.1

# =============================================================================
# REPORT GENERATION AND FORMATTING PARAMETERS
# =============================================================================

# Default report format
report.default.format=html

# Available formats
report.formats=html,pdf,excel,csv,json

# PDF generation settings
report.pdf.page.size=A4
report.pdf.orientation=portrait
report.pdf.font=Helvetica
report.pdf.font.size=10

# Excel generation settings
report.excel.sheet.name=Report
report.excel.header.style=bold

# CSV generation settings
report.csv.separator=,
report.csv.include.header=true
report.csv.quote.strings=true

# Date/time formatting
report.datetime.format=yyyy-MM-dd HH:mm:ss
report.date.format=yyyy-MM-dd
report.time.format=HH:mm:ss

# Number formatting
report.decimal.format=#.##
report.speed.unit=km/h
report.distance.unit=km
report.altitude.unit=m
report.volume.unit=liter

# =============================================================================
# REPORT DELIVERY SETTINGS
# =============================================================================

# Email delivery settings for testing
report.mail.smtp.host=localhost
report.mail.smtp.port=3025
report.mail.smtp.starttls.enable=false
report.mail.smtp.auth=false
report.mail.smtp.username=test
report.mail.smtp.password=test
report.mail.from=reporting-test@traccar.org

# File export settings
report.export.dir=./target/test-reports
report.export.cleanup=true

# =============================================================================
# TEST-SPECIFIC OVERRIDES
# =============================================================================

# Override device attributes for testing
report.test.device.speedLimit=90
report.test.device.fuelCapacity=100
report.test.device.fuelConsumption=10

# Mock external services
report.test.mock.geocoder=true
report.test.mock.speedlimit=true
report.test.mock.weather=true

# Test data generation
report.test.generate.positions=100
report.test.generate.events=20
report.test.generate.trips=5

# Test execution settings
report.test.timeout.default=10000
report.test.timeout.long=30000
report.test.parallel.execution=true