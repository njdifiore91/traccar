# Testcontainers Global Configuration
# This file configures the behavior of Testcontainers library for container-based testing

# CONTAINER REUSE
# Enable container reuse to improve test performance by not destroying containers after tests
# This significantly reduces test execution time in development environments
reuse.enable=true

# RESOURCE LIMITS
# Configure default resource limits for containers to prevent resource exhaustion
# CPU limit (number of CPUs)
docker.container.cpus=2
# Memory limit (in MB)
docker.container.memory=1024

# IMAGE PULL POLICY
# Configure image pull behavior to optimize container startup time
# Timeout for image pulls (in seconds)
pull.timeout=120
# Timeout for stalled pulls (in seconds)
pull.pause.timeout=30
# Use AlwaysPullPolicy for CI environments to ensure latest images
# Uncomment the following line for CI environments:
# pull.policy=org.testcontainers.images.AlwaysPullPolicy

# RYUK CONTAINER CONFIGURATION
# Ryuk is responsible for container cleanup
# Disable Ryuk for CI environments that handle their own cleanup
# Set to true in CI environments that don't allow privileged containers
# ryuk.disabled=true

# Run Ryuk in privileged mode if needed
ryuk.container.privileged=true

# STARTUP CHECKS
# Disable startup checks to speed up container initialization
# Only disable if you're sure your environment is properly configured
checks.disable=true

# DOCKER CLIENT CONFIGURATION
# Use the environment and system property strategy for Docker client configuration
docker.client.strategy=org.testcontainers.dockerclient.EnvironmentAndSystemPropertyClientProviderStrategy

# LOGGING
# Configure logging for Testcontainers
# Uncomment to enable debug logging
# tinylog.level=debug