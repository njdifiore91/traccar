# JUnit 5 Platform Configuration

# Parallel execution settings
junit.jupiter.execution.parallel.enabled=true
junit.jupiter.execution.parallel.mode.default=concurrent
junit.jupiter.execution.parallel.mode.classes.default=concurrent

# Dynamic parallelism strategy based on available resources
# Uses a factor of available processors to determine thread count
junit.jupiter.execution.parallel.config.strategy=dynamic
junit.jupiter.execution.parallel.config.dynamic.factor=0.5

# Fallback fixed parallelism settings if dynamic strategy is not available
junit.jupiter.execution.parallel.config.fixed.parallelism=4
junit.jupiter.execution.parallel.config.fixed.max-pool-size=8

# Test instance lifecycle - per_class for efficient resource usage
junit.jupiter.testinstance.lifecycle.default=per_class

# Test execution order - for deterministic test runs
junit.jupiter.testmethod.order.default=org.junit.jupiter.api.MethodOrderer$OrderAnnotation
junit.jupiter.testclass.order.default=org.junit.jupiter.api.ClassOrderer$OrderAnnotation

# Display name generator for readable test reports
junit.jupiter.displayname.generator.default=org.junit.jupiter.api.DisplayNameGenerator$ReplaceUnderscores

# Enable output capture for test diagnostics
junit.platform.output.capture.stdout=true
junit.platform.output.capture.stderr=true
junit.platform.output.ansi.enabled=true