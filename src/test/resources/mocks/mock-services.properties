# Mock Services Configuration for Testing
# This file defines connection parameters, behavior settings, and response characteristics
# for simulated external services used in testing environments.

# =============================================================================
# General Mock Service Settings
# =============================================================================
mock.enabled=true
mock.default.timeout=5000
mock.default.success.rate=1.0
mock.default.response.delay=0
mock.default.port.range.start=9000
mock.default.port.range.end=9100

# =============================================================================
# Geocoding Service Mocks
# =============================================================================

# Google Maps Geocoding API Mock
geocode.google.enabled=true
geocode.google.url=http://localhost:9001/maps/api/geocode/json
geocode.google.key=test-api-key
geocode.google.success.rate=0.99
geocode.google.response.delay=100
geocode.google.response.file=mocks/geocoding/google-response.json

# OpenStreetMap Nominatim Mock
geocode.nominatim.enabled=true
geocode.nominatim.url=http://localhost:9002/nominatim/search
geocode.nominatim.success.rate=0.98
geocode.nominatim.response.delay=150
geocode.nominatim.response.file=mocks/geocoding/nominatim-response.json

# Here Maps Geocoding Mock
geocode.here.enabled=true
geocode.here.url=http://localhost:9003/here/geocode
geocode.here.app.id=test-app-id
geocode.here.app.code=test-app-code
geocode.here.success.rate=0.97
geocode.here.response.delay=120
geocode.here.response.file=mocks/geocoding/here-response.json

# MapBox Geocoding Mock
geocode.mapbox.enabled=true
geocode.mapbox.url=http://localhost:9004/mapbox/geocoding/v5
geocode.mapbox.key=test-access-token
geocode.mapbox.success.rate=0.99
geocode.mapbox.response.delay=80
geocode.mapbox.response.file=mocks/geocoding/mapbox-response.json

