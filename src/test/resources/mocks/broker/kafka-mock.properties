# Kafka Mock Properties for Testing
# This file provides configuration for simulating Kafka broker functionality in tests
# without requiring actual Kafka infrastructure

# Connection Parameters
bootstrap.servers=mock://localhost:9092
mock.broker.id=1
mock.broker.count=1

# Topic Configuration
mock.topics=positions,events,commands,notifications
mock.topic.partitions=1
mock.topic.replication.factor=1

# Consumer Configuration
consumer.group.id=test-consumer-group
consumer.auto.offset.reset=earliest
consumer.enable.auto.commit=true
consumer.auto.commit.interval.ms=1000

# Producer Configuration
producer.acks=all
producer.retries=0
producer.batch.size=16384
producer.linger.ms=1
producer.buffer.memory=33554432

# Serialization Configuration
key.serializer=org.apache.kafka.common.serialization.StringSerializer
value.serializer=org.apache.kafka.common.serialization.StringSerializer
key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
value.deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Mock Behavior Settings
mock.producer.auto.complete=true
mock.producer.exception.rate=0.0
mock.consumer.poll.timeout.ms=100
mock.consumer.max.poll.records=500

# Test-specific Settings
test.message.count=10
test.message.size.bytes=1024
test.execution.timeout.ms=30000

# Embedded Kafka Settings (for TestContainers or EmbeddedKafka)
embedded.kafka.broker.id=1
embedded.kafka.port=9092
embedded.zookeeper.port=2181
embedded.kafka.topics=positions,events,commands,notifications