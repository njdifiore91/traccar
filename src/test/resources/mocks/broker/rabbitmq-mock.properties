# RabbitMQ Mock Configuration for Testing
# This file provides configuration for simulating RabbitMQ message broker functionality
# without requiring actual RabbitMQ infrastructure during testing.

# Connection Parameters
mock.rabbitmq.connection.host=localhost
mock.rabbitmq.connection.port=5672
mock.rabbitmq.connection.username=guest
mock.rabbitmq.connection.password=guest
mock.rabbitmq.connection.virtualHost=/
mock.rabbitmq.connection.uri=amqp://guest:guest@localhost:5672/
mock.rabbitmq.connection.timeout=5000
mock.rabbitmq.connection.handshakeTimeout=10000

# Exchange Configuration
mock.rabbitmq.exchange.default.name=traccar.topic
mock.rabbitmq.exchange.default.type=topic
mock.rabbitmq.exchange.default.durable=true
mock.rabbitmq.exchange.default.autoDelete=false

# Additional exchanges for testing different scenarios
mock.rabbitmq.exchange.positions.name=traccar.positions
mock.rabbitmq.exchange.positions.type=topic
mock.rabbitmq.exchange.positions.durable=true

mock.rabbitmq.exchange.events.name=traccar.events
mock.rabbitmq.exchange.events.type=topic
mock.rabbitmq.exchange.events.durable=true

mock.rabbitmq.exchange.notifications.name=traccar.notifications
mock.rabbitmq.exchange.notifications.type=topic
mock.rabbitmq.exchange.notifications.durable=true

# Queue Configuration
mock.rabbitmq.queue.positions.name=positions.queue
mock.rabbitmq.queue.positions.durable=true
mock.rabbitmq.queue.positions.exclusive=false
mock.rabbitmq.queue.positions.autoDelete=false

mock.rabbitmq.queue.events.name=events.queue
mock.rabbitmq.queue.events.durable=true
mock.rabbitmq.queue.events.exclusive=false
mock.rabbitmq.queue.events.autoDelete=false

mock.rabbitmq.queue.notifications.name=notifications.queue
mock.rabbitmq.queue.notifications.durable=true
mock.rabbitmq.queue.notifications.exclusive=false
mock.rabbitmq.queue.notifications.autoDelete=false

# Binding Configuration
mock.rabbitmq.binding.positions.exchange=traccar.positions
mock.rabbitmq.binding.positions.queue=positions.queue
mock.rabbitmq.binding.positions.routingKey=position.#

mock.rabbitmq.binding.events.exchange=traccar.events
mock.rabbitmq.binding.events.queue=events.queue
mock.rabbitmq.binding.events.routingKey=event.#

mock.rabbitmq.binding.notifications.exchange=traccar.notifications
mock.rabbitmq.binding.notifications.queue=notifications.queue
mock.rabbitmq.binding.notifications.routingKey=notification.#

# Publisher Configuration
mock.rabbitmq.publisher.confirms=true
mock.rabbitmq.publisher.returns=true
mock.rabbitmq.publisher.mandatory=true
mock.rabbitmq.publisher.messageProperties=PERSISTENT_TEXT_PLAIN

# Consumer Configuration
mock.rabbitmq.consumer.autoAck=false
mock.rabbitmq.consumer.prefetchCount=10
mock.rabbitmq.consumer.exclusive=false

# Mock Behavior Settings
mock.rabbitmq.behavior.simulateNetworkDelay=false
mock.rabbitmq.behavior.networkDelayMs=50
mock.rabbitmq.behavior.simulateServerErrors=false
mock.rabbitmq.behavior.errorProbability=0.05
mock.rabbitmq.behavior.simulateChannelClose=false
mock.rabbitmq.behavior.channelCloseProbability=0.01

# Test Scenario Configuration
mock.rabbitmq.test.messageCount=100
mock.rabbitmq.test.messageSize=1024
mock.rabbitmq.test.consumerThreads=5
mock.rabbitmq.test.publisherThreads=2

# Dead Letter Exchange Configuration
mock.rabbitmq.dlx.enabled=true
mock.rabbitmq.dlx.name=traccar.dlx
mock.rabbitmq.dlx.routingKey=dead-letter
mock.rabbitmq.dlx.queue=dead-letter.queue

# Message TTL Configuration
mock.rabbitmq.message.ttl=30000

# Specific Protocol Settings for AmqpClient
mock.rabbitmq.amqpclient.exchange=traccar.topic
mock.rabbitmq.amqpclient.topic=position.update