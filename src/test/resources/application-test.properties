# ===================================================================
# COMMON TEST CONFIGURATION PROPERTIES
#
# This file contains configuration properties for test environments.
# It overrides the default application.properties settings during test execution.
# ===================================================================

# ===================================================================
# DATABASE CONFIGURATION
# ===================================================================

# Use H2 in-memory database for tests
database.driver=org.h2.Driver
database.url=jdbc:h2:mem:traccar;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false
database.user=sa
database.password=

# Database connection pool settings
database.pool.maxActive=10
database.pool.maxIdle=5
database.pool.minIdle=2
database.pool.testOnBorrow=true
database.pool.validationQuery=SELECT 1

# Disable schema migration for tests (schema created programmatically)
liquibase.changelog=classpath:db/changelog-master-test.xml
liquibase.enabled=true

# ===================================================================
# MESSAGE BROKER CONFIGURATION
# ===================================================================

# Kafka configuration for tests (using embedded Kafka for testing)
kafka.enabled=false
kafka.bootstrap.servers=localhost:9092
kafka.consumer.group.id=traccar-test
kafka.consumer.auto.offset.reset=earliest
kafka.producer.acks=all
kafka.producer.retries=3
kafka.producer.batch.size=16384
kafka.producer.linger.ms=1
kafka.producer.buffer.memory=33554432

# RabbitMQ configuration for tests (using embedded RabbitMQ for testing)
rabbitmq.enabled=false
rabbitmq.host=localhost
rabbitmq.port=5672
rabbitmq.username=guest
rabbitmq.password=guest
rabbitmq.virtual-host=/
rabbitmq.connection.timeout=5000
rabbitmq.requested-heartbeat=30
rabbitmq.automatic-recovery-enabled=true
rabbitmq.topology-recovery-enabled=true

# ===================================================================
# SERVICE DISCOVERY CONFIGURATION
# ===================================================================

# Consul configuration for tests (using embedded Consul for testing)
consul.enabled=false
consul.host=localhost
consul.port=8500
consul.service.name=traccar-test
consul.service.id=traccar-test-1
consul.service.port=8082
consul.check.interval=10s
consul.check.timeout=5s

# Kubernetes service discovery configuration for tests
kubernetes.discovery.enabled=false
kubernetes.namespace=default
kubernetes.trust-certificates=true
kubernetes.master-url=https://kubernetes.default.svc

# ===================================================================
# LOGGING CONFIGURATION
# ===================================================================

# Set logging levels for tests
logging.level.root=WARN
logging.level.org.traccar=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
logging.level.org.springframework=WARN
logging.level.com.zaxxer.hikari=WARN
logging.level.io.netty=WARN

# Disable logging to file for tests
logging.file.enabled=false

# ===================================================================
# MICROSERVICES TEST CONFIGURATION
# ===================================================================

# Protocol service test configuration
protocol-service.url=http://localhost:8091
protocol-service.mock.enabled=true

# Position service test configuration
position-service.url=http://localhost:8092
position-service.mock.enabled=true

# Event service test configuration
event-service.url=http://localhost:8093
event-service.mock.enabled=true

# Notification service test configuration
notification-service.url=http://localhost:8094
notification-service.mock.enabled=true

# API Gateway service test configuration
api-gateway.url=http://localhost:8095
api-gateway.mock.enabled=true

# Reporting service test configuration
reporting-service.url=http://localhost:8096
reporting-service.mock.enabled=true

# ===================================================================
# OBSERVABILITY CONFIGURATION FOR TESTS
# ===================================================================

# OpenTelemetry configuration for tests
opentelemetry.enabled=false
opentelemetry.service.name=traccar-test
opentelemetry.exporter.jaeger.endpoint=http://localhost:14250

# Micrometer/Prometheus configuration for tests
management.metrics.export.prometheus.enabled=false
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always

# ===================================================================
# SECURITY CONFIGURATION FOR TESTS
# ===================================================================

# Disable security for tests
security.basic.enabled=false
security.ignored=/**

# JWT configuration for tests
jwt.secret=test-secret-key-for-jwt-token-generation-in-test-environment
jwt.expiration=3600

# ===================================================================
# MISCELLANEOUS TEST SETTINGS
# ===================================================================

# Enable test mode
test.mode=true

# Disable device connection timeout for tests
device.connection.timeout=0

# Use mock implementations for external services
external.services.mock.enabled=true

# Geocoder test configuration (use mock geocoder)
geocoder.enable=false
geocoder.type=mock

# Speed limit provider test configuration (use mock provider)
speedlimit.enable=false
speedlimit.type=mock

# Disable scheduled tasks during tests
scheduler.enable=false