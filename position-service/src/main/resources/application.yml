# Position Service Configuration

spring:
  application:
    name: position-service
  
  # Kafka Configuration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: position-processors
      auto-offset-reset: earliest
      enable-auto-commit: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

# Server Configuration
server:
  port: ${SERVER_PORT:8081}

# Management Endpoints Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true

# Service Discovery Configuration
eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}

# Position Service Specific Configuration
position:
  topic: raw-positions

# Outbox Configuration
outbox:
  batchSize: 100
  maxRetries: 5
  processInterval: 1000

# Circuit Breaker Configuration
circuitbreaker:
  GeocoderHandler:
    failureRateThreshold: 30.0
    waitDurationInOpenState: 30
  GeolocationHandler:
    failureRateThreshold: 30.0
    waitDurationInOpenState: 30
  SpeedLimitHandler:
    failureRateThreshold: 30.0
    waitDurationInOpenState: 30
  PositionForwardingHandler:
    failureRateThreshold: 50.0
    waitDurationInOpenState: 10
  rabbitmq:
    failureRateThreshold: 60.0
    waitDurationInOpenState: 5

# Logging Configuration
logging:
  level:
    root: INFO
    org.traccar: INFO
    org.springframework.kafka: WARN
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss} [%thread] [%X{x-correlation-id}] %-5level %logger{36} - %msg%n'

# OpenTelemetry Configuration
opentelemetry:
  traces:
    exporter: jaeger
  metrics:
    exporter: prometheus
  propagators: tracecontext,baggage
  jaeger:
    endpoint: ${JAEGER_ENDPOINT:http://localhost:14250}
    service-name: ${spring.application.name}