# OpenTelemetry Configuration for Position Processing Service
# Enables distributed tracing across service boundaries with correlation ID propagation

# Service Information
otel.service.name=position-service
otel.resource.attributes=service.namespace=traccar,service.version=${service.version:latest},deployment.environment=${deployment.environment:production}

# Exporter Configuration
otel.traces.exporter=otlp
otel.metrics.exporter=otlp
otel.logs.exporter=otlp
otel.exporter.otlp.endpoint=http://otel-collector:4317
otel.exporter.otlp.protocol=grpc

# Trace Sampling Configuration - Balances observability with performance
# parentbased_traceidratio ensures consistent sampling decisions within a trace
# 0.1 means approximately 10% of traces will be sampled
otel.traces.sampler=parentbased_traceidratio
otel.traces.sampler.arg=0.1

# Context Propagation - Ensures trace context is maintained across service boundaries
# tracecontext: W3C standard for HTTP headers
# baggage: For passing additional context
# b3: For compatibility with Zipkin-based systems
otel.propagators=tracecontext,baggage,b3

# Batch Processing Configuration - Optimizes exporting of telemetry data
otel.bsp.schedule.delay=5000
otel.bsp.max.queue.size=2048
otel.bsp.max.export.batch.size=512
otel.bsp.export.timeout=30000

# Span Limits - Controls telemetry data volume
otel.span.attribute.count.limit=128
otel.span.event.count.limit=64
otel.span.link.count.limit=32

# Message Processing Context Propagation - Critical for asynchronous operations
# Ensures trace context is maintained across message broker boundaries
otel.instrumentation.messaging.experimental.receive-telemetry.enabled=true

# Correlation with Logs and Metrics - Enables unified observability
otel.logs.exporter.otlp.traces.enabled=true
otel.instrumentation.logback-appender.experimental.capture-code-attributes=true
otel.instrumentation.logback-appender.experimental.capture-marker-attribute=true

# Position Service Specific Instrumentation - Targets key components
otel.instrumentation.methods.include=org.traccar.geofence.*[*],org.traccar.geocoder.*[*],org.traccar.handler.*[*]

# Circuit Breaker Instrumentation - For resilience monitoring
otel.instrumentation.resilience4j.enabled=true

# Database Instrumentation - For monitoring database interactions
otel.instrumentation.jdbc.enabled=true

# HTTP Client Instrumentation - For external API calls
otel.instrumentation.http.enabled=true