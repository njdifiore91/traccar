# Testcontainers configuration for Position Service tests

# Enable container reuse for improved test performance
testcontainers.reuse.enable=true

# Disable startup checks to speed up test execution
checks.disable=true

# Configure resource limits for test containers
# These limits help prevent containers from consuming too many resources
# Memory limits are in bytes (2GB = 2 * 1024 * 1024 * 1024)
docker.container.memory.limit=2147483648
docker.container.cpu.limit=2.0

# Configure image pull policy to optimize container startup time
# Only pull images if they don't exist locally
pull.policy=org.testcontainers.images.LocalImagesOnlyPolicy
pull.timeout=300
pull.pause.timeout=60

# Database container configuration for position data testing
# PostgreSQL configuration
postgresql.container.startup.timeout=120
postgresql.container.startup.log.check=true

# Message broker container configuration
# RabbitMQ configuration
rabbitmq.container.startup.timeout=180

# Kafka configuration
kafka.container.startup.timeout=180

# Ryuk container configuration (container cleanup)
ryuk.container.privileged=false