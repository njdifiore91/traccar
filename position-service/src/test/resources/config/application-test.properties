# Position Service Test Configuration

# =============================================================================
# Database Configuration
# =============================================================================
# Use H2 in-memory database for tests
database.driver=org.h2.Driver
database.url=jdbc:h2:mem:traccar_test;DB_CLOSE_DELAY=-1;MODE=MySQL
database.user=sa
database.password=

# =============================================================================
# Service Endpoints
# =============================================================================
# Mock service endpoints for testing
service.geocoder.url=http://localhost:8081/mock/geocoder
service.speedlimit.url=http://localhost:8081/mock/speedlimit
service.map.url=http://localhost:8081/mock/map

# =============================================================================
# Message Broker Configuration
# =============================================================================
# Use embedded broker for tests
message.broker.type=embedded
message.broker.host=localhost
message.broker.port=5672
message.broker.username=guest
message.broker.password=guest

# =============================================================================
# Service Discovery Configuration
# =============================================================================
# Disable service discovery for unit tests
service.discovery.enabled=false
service.discovery.host=localhost
service.discovery.port=8500

# =============================================================================
# Test Mode Flags
# =============================================================================
# Enable test mode
test.mode=true

# Skip certain operations in test mode
test.skip.device.validation=true
test.skip.notification.sending=true
test.skip.external.integration=true

# =============================================================================
# Logging Configuration
# =============================================================================
# Set logging levels for tests
logger.console.level=INFO
logger.file.level=OFF
logger.position.level=DEBUG
logger.event.level=DEBUG
logger.geocoder.level=DEBUG

# =============================================================================
# Cache Configuration
# =============================================================================
# Use in-memory cache for tests
cache.type=memory
cache.expiry.positions=60
cache.expiry.devices=60

# =============================================================================
# Position Processing Configuration
# =============================================================================
# Configure position processing for tests
position.processing.batch.size=10
position.processing.threads=2

# =============================================================================
# Geofence Configuration
# =============================================================================
# Configure geofence processing for tests
geofence.processing.enabled=true
geofence.processing.threads=1

# =============================================================================
# Forward Configuration
# =============================================================================
# Disable forwarding in tests
forward.enabled=false

# =============================================================================
# Testcontainers Configuration
# =============================================================================
# Enable reuse for faster test execution
testcontainers.reuse.enable=true