# Position Handler Chain Configuration for Testing
handlers=processing,distance,filter,geofence,geocoder

# Processing Handler Configuration
processing.copyAttributes=true
processing.computeAttributes=true
processing.validateHdop=true
processing.hdopThreshold=10.0

# Distance Handler Configuration
distance.enable=true
distance.minValue=0.0
distance.maxValue=10000.0
distance.ignoreOdometer=false
distance.useOdometer=false

# Filter Handler Configuration
filter.enable=true
filter.invalid=true
filter.zero=true
filter.duplicate=true
filter.future=300
filter.approximate=true
filter.static=true
filter.distance=10
filter.maxSpeed=500
filter.skipLimit=10
filter.skipAttributes.enable=true
filter.skipAttributes=alarm,result

# Geofence Handler Configuration
geofence.enable=true
geofence.processInvalidPositions=false
geofence.checkExisting=true

# Geocoder Handler Configuration
geocoder.enable=true
geocoder.onRequest=false
geocoder.format=%h %r, %t, %s, %c
geocoder.reuse=true
geocoder.reuseDistance=100