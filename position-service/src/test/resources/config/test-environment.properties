# Position Service Test Environment Properties
# Contains environment-specific configuration for Position Service tests

# Environment Detection
# Auto-detects the current test environment based on environment variables
# Default is 'local' if no specific environment is detected
test.environment=${TEST_ENVIRONMENT:local}

# ----------------------------------------
# Local Development Environment Settings
# ----------------------------------------

# Database Configuration - Local
local.database.url=jdbc:h2:mem:traccar-test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
local.database.username=sa
local.database.password=
local.database.driver=org.h2.Driver
local.database.max-pool-size=10
local.database.check-connection=true

# Message Broker - Local
local.broker.type=embedded
local.broker.host=localhost
local.broker.port=5672
local.broker.username=guest
local.broker.password=guest
local.broker.virtual-host=/
local.broker.position-topic=test.positions
local.broker.event-topic=test.events

# Service Discovery - Local
local.discovery.enabled=false
local.discovery.host=localhost
local.discovery.port=8500

# Dependent Services - Local
local.geocoder.url=http://localhost:8090/geocoder
local.speedlimit.url=http://localhost:8091/speedlimit
local.geolocation.url=http://localhost:8092/geolocation

# ----------------------------------------
# CI Environment Settings
# ----------------------------------------

# Database Configuration - CI
ci.database.url=jdbc:postgresql://postgres:5432/traccar_test
ci.database.username=test
ci.database.password=test
ci.database.driver=org.postgresql.Driver
ci.database.max-pool-size=5
ci.database.check-connection=true

# Message Broker - CI
ci.broker.type=rabbitmq
ci.broker.host=rabbitmq
ci.broker.port=5672
ci.broker.username=guest
ci.broker.password=guest
ci.broker.virtual-host=/
ci.broker.position-topic=ci.positions
ci.broker.event-topic=ci.events

# Service Discovery - CI
ci.discovery.enabled=true
ci.discovery.host=consul
ci.discovery.port=8500

# Dependent Services - CI
ci.geocoder.url=http://geocoder-service:8080/geocoder
ci.speedlimit.url=http://speedlimit-service:8080/speedlimit
ci.geolocation.url=http://geolocation-service:8080/geolocation

# ----------------------------------------
# Staging Environment Settings
# ----------------------------------------

# Database Configuration - Staging
staging.database.url=jdbc:postgresql://postgres-staging:5432/traccar_staging
staging.database.username=${STAGING_DB_USERNAME}
staging.database.password=${STAGING_DB_PASSWORD}
staging.database.driver=org.postgresql.Driver
staging.database.max-pool-size=10
staging.database.check-connection=true

# Message Broker - Staging
staging.broker.type=rabbitmq
staging.broker.host=rabbitmq-staging
staging.broker.port=5672
staging.broker.username=${STAGING_BROKER_USERNAME}
staging.broker.password=${STAGING_BROKER_PASSWORD}
staging.broker.virtual-host=/
staging.broker.position-topic=staging.positions
staging.broker.event-topic=staging.events

# Service Discovery - Staging
staging.discovery.enabled=true
staging.discovery.host=consul-staging
staging.discovery.port=8500

# Dependent Services - Staging
staging.geocoder.url=http://geocoder-service.staging:8080/geocoder
staging.speedlimit.url=http://speedlimit-service.staging:8080/speedlimit
staging.geolocation.url=http://geolocation-service.staging:8080/geolocation

# ----------------------------------------
# Test Data Configuration
# ----------------------------------------

# Test Device Configuration
test.device.id=1
test.device.uniqueid=test123456789
test.device.name=Test Device

# Test Position Configuration
test.position.latitude=40.7128
test.position.longitude=-74.0060
test.position.altitude=10.0
test.position.speed=50.0
test.position.course=90.0

# Test Geofence Configuration
test.geofence.id=1
test.geofence.name=Test Geofence
test.geofence.area=CIRCLE (40.7128 -74.0060, 1000)

# ----------------------------------------
# Test Execution Configuration
# ----------------------------------------

# Testcontainers Configuration
test.containers.reuse=true
test.containers.postgres.tag=14-alpine
test.containers.rabbitmq.tag=3.11-management-alpine
test.containers.consul.tag=1.15

# Mock Service Configuration
test.mock.geocoder.enabled=true
test.mock.speedlimit.enabled=true
test.mock.geolocation.enabled=true

# Test Isolation
test.database.schema=position_test_${random.uuid}
test.broker.queue-prefix=test_${random.uuid}_