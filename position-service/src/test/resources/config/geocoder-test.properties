# Geocoder Test Configuration for Position Service

# General geocoder settings
geocode.enable=true
geocode.format=%h %r, %t, %s, %c
geocode.on.request=false
geocode.on.position=true
geocode.process.new.positions=true
geocode.reuse=true
geocode.caching.enable=true
geocode.cache.size=1000
geocode.cache.expiry=86400

# Geocoder implementation selection
geocode.type=mock

# Mock geocoder settings (for testing)
geocode.mock.enable=true
geocode.mock.fixed.latitude=40.7128
geocode.mock.fixed.longitude=-74.0060
geocode.mock.fixed.address=Test Address, Test City, Test State, Test Country
geocode.mock.error.rate=0.1
geocode.mock.delay.min=10
geocode.mock.delay.max=50

# Geocoder service endpoints (for reference, not used with mock geocoder)
geocode.google.url=https://maps.googleapis.com/maps/api/geocode/json
geocode.nominatim.url=https://nominatim.openstreetmap.org/reverse
geocode.opencage.url=http://api.opencagedata.com/geocode/v1
geocode.gisgraphy.url=http://services.gisgraphy.com/reversegeocoding/search
geocode.ban.url=https://api-adresse.data.gouv.fr/reverse/
geocode.here.url=https://revgeocode.search.hereapi.com/v1/revgeocode
geocode.mapbox.url=https://api.mapbox.com/geocoding/v5/mapbox.places/
geocode.maptiler.url=https://api.maptiler.com/geocoding/
geocode.geoapify.url=https://api.geoapify.com/v1/geocode/reverse

# API keys for test environment (using placeholder values)
geocode.google.key=test_google_api_key
geocode.opencage.key=test_opencage_api_key
geocode.here.key=test_here_api_key
geocode.mapbox.key=test_mapbox_api_key
geocode.maptiler.key=test_maptiler_api_key
geocode.geoapify.key=test_geoapify_api_key

# Geocoder timeout settings
geocode.timeout=3000

# Geocoder language settings
geocode.language=en

# Geocoder rate limiting
geocode.ratelimit.enable=true
geocode.ratelimit.requests=100
geocode.ratelimit.interval=60

# Geocoder error handling
geocode.retry.count=3
geocode.retry.delay=1000
geocode.fallback.enable=true
geocode.fallback.type=nominatim