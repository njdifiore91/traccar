# Message Broker Test Configuration for Position Service

# Common message broker settings
message.broker.type=kafka
# message.broker.type=rabbitmq

# Consumer configuration
message.consumer.enabled=true
message.consumer.group-id=position-processors
message.consumer.topics=raw.positions
message.consumer.concurrency=3
message.consumer.max-poll-records=100
message.consumer.auto-offset-reset=earliest
message.consumer.max-poll-interval-ms=300000
message.consumer.session-timeout-ms=60000
message.consumer.heartbeat-interval-ms=20000
message.consumer.max-partition-fetch-bytes=1048576
message.consumer.fetch-max-wait-ms=500
message.consumer.fetch-min-bytes=1
message.consumer.isolation-level=read_committed

# Producer configuration
message.producer.enabled=true
message.producer.topic=enriched.positions
message.producer.acks=all
message.producer.retries=3
message.producer.batch-size=16384
message.producer.buffer-memory=33554432
message.producer.linger-ms=0
message.producer.request-timeout-ms=30000
message.producer.compression-type=none
message.producer.max-in-flight-requests=5

# Kafka specific settings
kafka.bootstrap-servers=localhost:9092
kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
kafka.consumer.properties.spring.json.trusted.packages=org.traccar.model,org.traccar.proto
kafka.consumer.properties.spring.json.use.type.headers=true
kafka.consumer.properties.spring.json.value.default.type=org.traccar.model.Position

# RabbitMQ specific settings (alternative)
# rabbitmq.host=localhost
# rabbitmq.port=5672
# rabbitmq.username=guest
# rabbitmq.password=guest
# rabbitmq.virtual-host=/
# rabbitmq.exchange=traccar.positions
# rabbitmq.routing-key.consumer=raw.positions
# rabbitmq.routing-key.producer=enriched.positions
# rabbitmq.queue=position-processors
# rabbitmq.listener.simple.prefetch=10
# rabbitmq.listener.simple.default-requeue-rejected=false
# rabbitmq.listener.simple.retry.enabled=true
# rabbitmq.listener.simple.retry.initial-interval=1000
# rabbitmq.listener.simple.retry.max-attempts=3
# rabbitmq.listener.simple.retry.multiplier=1.5
# rabbitmq.listener.simple.retry.max-interval=10000

# Error handling
message.error-handler.enabled=true
message.error-handler.retry-count=3
message.error-handler.backoff-initial-interval=1000
message.error-handler.backoff-multiplier=2.0
message.error-handler.backoff-max-interval=10000
message.error-handler.dead-letter-queue-suffix=.DLQ

# Batch processing
message.batch-processing.enabled=true
message.batch-processing.max-batch-size=100
message.batch-processing.buffer-time-ms=200
message.batch-processing.concurrent-consumers=2

# Message tracing and monitoring
message.tracing.enabled=true
message.metrics.enabled=true

# Test-specific settings
test.message.mock-broker=true
test.message.mock-consumer.position-count=50
test.message.mock-consumer.device-count=10
test.message.mock-consumer.interval-ms=100