# Geofence Test Configuration Properties
# This file contains configuration settings for geofence calculations in test environments

# Geofence detection thresholds
geofence.detection.enabled=true
geofence.detection.minUpdateInterval=1000
geofence.detection.considerAccuracy=true
geofence.detection.accuracyThreshold=50

# Spatial calculation parameters
geofence.spatial.srid=4326
geofence.spatial.distanceCalculation=haversine
geofence.spatial.bufferSize=10
geofence.spatial.simplificationTolerance=0.00001

# Test geofence definitions
geofence.test.circle=CIRCLE (55.75414 37.6204, 100)
geofence.test.polygon=POLYGON ((55.75474 37.61823, 55.75513 37.61888, 55.7535 37.6222, 55.75315 37.62165))
geofence.test.polygon180=POLYGON ((66.9494 179.838, 66.9508 -179.8496, 66.8406 -180.0014))
geofence.test.polygon0=POLYGON ((51.1966 -0.6207, 51.1897 0.4147, 50.9377 0.5136, 50.8675 -0.6082))

# Geofence event triggering parameters
geofence.event.onEntry=true
geofence.event.onExit=true
geofence.event.onDeviation=false
geofence.event.deviationThreshold=100
geofence.event.minNotificationInterval=60000

# Geofence calculation performance settings
geofence.calculation.cacheEnabled=true
geofence.calculation.cacheSize=1000
geofence.calculation.cacheExpiry=300
geofence.calculation.batchSize=100

# Geofence test mode settings
geofence.test.mode=true
geofence.test.mockPositions=true
geofence.test.skipDatabase=true
geofence.test.logLevel=DEBUG