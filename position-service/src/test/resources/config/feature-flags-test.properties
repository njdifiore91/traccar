# Position Service Feature Flags for Testing Environment
# This configuration file contains feature flags used during test execution
# These settings should not affect production environments

# ======================================================
# Core Feature Toggles
# ======================================================

# Enable/disable experimental position processing pipeline
position.processing.experimental.enabled=true

# Enable/disable enhanced geofencing calculations
position.geofencing.enhanced.enabled=true

# Enable/disable position buffering for out-of-order message handling
position.buffering.enabled=true

# Enable/disable position deduplication
position.deduplication.enabled=true

# Enable/disable position validation
position.validation.enabled=true

# ======================================================
# Implementation Strategy Selection
# ======================================================

# Position processing strategy (options: default, batch, stream)
position.processing.strategy=batch

# Geofence calculation strategy (options: simple, optimized, precise)
position.geofencing.strategy=optimized

# Position storage strategy (options: default, timeseries, hybrid)
position.storage.strategy=hybrid

# ======================================================
# Feature-Specific Parameters
# ======================================================

# Maximum buffer size for position buffering
position.buffering.max-size=1000

# Buffer timeout in milliseconds
position.buffering.timeout-ms=5000

# Deduplication window in milliseconds
position.deduplication.window-ms=60000

# Geofence precision level (1-10, higher is more precise)
position.geofencing.precision=8

# Position validation strictness (1-5, higher is stricter)
position.validation.strictness=3

# ======================================================
# Gradual Rollout Simulation Settings
# ======================================================

# Percentage of devices to use experimental pipeline (0-100)
position.experimental.rollout.percentage=50

# Device IDs to always use experimental pipeline (comma-separated)
position.experimental.rollout.device-ids=123,456,789

# Percentage of positions to apply enhanced validation (0-100)
position.validation.enhanced.percentage=75

# ======================================================
# Testing-Specific Settings
# ======================================================

# Enable/disable mock external services
test.mock.external-services.enabled=true

# Enable/disable performance testing mode
test.performance-mode.enabled=false

# Enable/disable fault injection for resilience testing
test.fault-injection.enabled=true

# Fault injection rate (percentage of operations, 0-100)
test.fault-injection.rate=10