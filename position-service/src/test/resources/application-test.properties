# Position Service Test Configuration

# Application settings
spring.application.name=position-service
spring.profiles.active=test

# Server settings
server.port=0

# Database configuration
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

# HikariCP settings
spring.datasource.hikari.minimumIdle=2
spring.datasource.hikari.maximumPoolSize=5
spring.datasource.hikari.idleTimeout=30000
spring.datasource.hikari.maxLifetime=60000
spring.datasource.hikari.connectionTimeout=20000
spring.datasource.hikari.poolName=PositionServiceHikariCP

# Message broker settings - Kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=position-service-test
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.properties.spring.json.trusted.packages=org.traccar.model,org.traccar.proto
spring.kafka.template.default-topic=test-positions

# Message broker settings - RabbitMQ (alternative)
#spring.rabbitmq.host=localhost
#spring.rabbitmq.port=5672
#spring.rabbitmq.username=guest
#spring.rabbitmq.password=guest
#spring.rabbitmq.virtual-host=/

# Service discovery settings
spring.cloud.consul.enabled=false
spring.cloud.consul.host=localhost
spring.cloud.consul.port=8500
spring.cloud.consul.discovery.enabled=false
spring.cloud.consul.discovery.instanceId=${spring.application.name}:${random.value}
spring.cloud.consul.discovery.healthCheckPath=/actuator/health
spring.cloud.consul.discovery.healthCheckInterval=15s

# Kubernetes service discovery (alternative)
spring.cloud.kubernetes.discovery.enabled=false
spring.cloud.kubernetes.discovery.all-namespaces=false

# Position processing settings
position.processing.batch-size=100
position.processing.max-queue-size=1000
position.processing.thread-pool-size=5
position.processing.validation.enabled=true
position.processing.filtering.enabled=true
position.processing.filtering.duplicate-distance=0.0
position.processing.filtering.duplicate-time=60000
position.processing.filtering.invalid-position-threshold=10000

# Geocoding service mock configuration
geocoding.enabled=false
geocoding.url=http://localhost:8081/mock/geocoder
geocoding.key=test-key
geocoding.cacheSize=100
geocoding.processInvalidPositions=false

# Geolocation service mock configuration
geolocation.enabled=false
geolocation.url=http://localhost:8081/mock/geolocation
geolocation.key=test-key

# Speed limit provider mock configuration
speedlimit.enabled=false
speedlimit.url=http://localhost:8081/mock/speedlimit
speedlimit.key=test-key

# Actuator settings
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# Resilience4j circuit breaker settings
resilience4j.circuitbreaker.instances.geocodingService.slidingWindowSize=10
resilience4j.circuitbreaker.instances.geocodingService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.geocodingService.waitDurationInOpenState=10000
resilience4j.circuitbreaker.instances.geocodingService.permittedNumberOfCallsInHalfOpenState=3

# Logging settings
logging.level.root=INFO
logging.level.org.traccar=DEBUG
logging.level.org.springframework=WARN
logging.level.com.zaxxer.hikari=WARN
logging.level.org.hibernate=WARN

# OpenTelemetry settings
otel.traces.exporter=logging
otel.metrics.exporter=logging
otel.logs.exporter=logging
otel.service.name=position-service-test
otel.propagation.type=w3c

# Test-specific settings
test.data.device-count=10
test.data.position-count=100
test.mock.external-services=true