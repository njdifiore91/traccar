# JUnit Platform Configuration for Position Service Tests

# Enable parallel test execution to reduce build time
junit.jupiter.execution.parallel.enabled=true

# Set default parallel execution mode to concurrent for methods within a class
junit.jupiter.execution.parallel.mode.default=concurrent

# Set parallel execution mode for classes to concurrent for maximum parallelism
junit.jupiter.execution.parallel.mode.classes.default=concurrent

# Use dynamic resource-based parallelism strategy
junit.jupiter.execution.parallel.config.strategy=dynamic

# Set dynamic parallelism factor (0.5 = 50% of available processors)
junit.jupiter.execution.parallel.config.dynamic.factor=0.5

# Set test instance lifecycle to per_class for efficient resource usage
junit.jupiter.testinstance.lifecycle.default=per_class

# Set test execution order to deterministic for repeatable test runs
junit.jupiter.testmethod.order.default=org.junit.jupiter.api.MethodOrderer$OrderAnnotation

# Configure display name generator for readable test reports
junit.jupiter.displayname.generator.default=org.junit.jupiter.api.DisplayNameGenerator$ReplaceUnderscores

# Disable ansi colors in test output for CI environments
junit.ansi.enabled=false

# Disable test abort when parent test fails
junit.jupiter.execution.parallel.failure.propagation.mode=never

# Enable test execution timeout to prevent hanging tests
junit.jupiter.execution.timeout.default=60s

# Configure test execution timeout for test methods
junit.jupiter.execution.timeout.testmethod.default=30s

# Configure test execution timeout for test template methods
junit.jupiter.execution.timeout.testtemplate.default=60s

# Configure test execution timeout for test factory methods
junit.jupiter.execution.timeout.testfactory.default=60s

# Configure test execution timeout for before all callbacks
junit.jupiter.execution.timeout.beforeall.default=60s

# Configure test execution timeout for before each callbacks
junit.jupiter.execution.timeout.beforeeach.default=30s

# Configure test execution timeout for after each callbacks
junit.jupiter.execution.timeout.aftereach.default=30s

# Configure test execution timeout for after all callbacks
junit.jupiter.execution.timeout.afterall.default=60s