apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: position-service
  namespace: position
  labels:
    app: position-service
    component: processing
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: position-service
  minReplicas: 2
  maxReplicas: 10
  metrics:
  # CPU utilization target (70%)
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  # Memory utilization target (80%)
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  # Custom metric for message processing rate
  - type: Pods
    pods:
      metric:
        name: messages_per_second
      target:
        type: AverageValue
        averageValue: 500
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 100
        periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 10
        periodSeconds: 120