{{- /*
Template for creating Kubernetes Ingress resources for Traccar microservices.

This template standardizes how services are exposed to external clients, ensuring
consistent routing, TLS configuration, and access control across all microservices.

Parameters:
  - .Values.ingress: The ingress configuration values
  - .Release: Release information provided by Helm
  - .Chart: Chart information provided by Helm
  - .Values.global: Global values that apply to all charts
  - .Values.service: Service configuration for the backend service

Usage:
```yaml
{{- include "traccar.ingress" (dict "Values" .Values "Release" .Release "Chart" .Chart) -}}
```
*/}}

{{- define "traccar.ingress" -}}
{{- if .Values.ingress.enabled -}}
{{- $fullName := include "traccar.fullname" . -}}
{{- $svcPort := .Values.service.port -}}
{{- $svcName := .Values.service.name | default $fullName -}}
{{- $pathType := .Values.ingress.pathType | default "Prefix" -}}
{{- $ingressApiVersion := .Values.ingress.apiVersion | default "networking.k8s.io/v1" -}}

{{- if and .Values.ingress.className (not (semverCompare ">=1.18-0" .Capabilities.KubeVersion.GitVersion)) }}
  {{- if not (hasKey .Values.ingress.annotations "kubernetes.io/ingress.class") }}
  {{- $_ := set .Values.ingress.annotations "kubernetes.io/ingress.class" .Values.ingress.className}}
  {{- end }}
{{- end }}

{{- if semverCompare ">=1.19-0" .Capabilities.KubeVersion.GitVersion -}}
apiVersion: {{ $ingressApiVersion }}
{{- else if semverCompare ">=1.14-0" .Capabilities.KubeVersion.GitVersion -}}
apiVersion: networking.k8s.io/v1beta1
{{- else -}}
apiVersion: extensions/v1beta1
{{- end }}
kind: Ingress
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "traccar.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if and .Values.ingress.className (semverCompare ">=1.18-0" .Capabilities.KubeVersion.GitVersion) }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            {{- if semverCompare ">=1.18-0" $.Capabilities.KubeVersion.GitVersion }}
            pathType: {{ $pathType }}
            {{- end }}
            backend:
              {{- if semverCompare ">=1.19-0" $.Capabilities.KubeVersion.GitVersion }}
              service:
                name: {{ $svcName }}
                port:
                  {{- if kindIs "string" $svcPort }}
                  name: {{ $svcPort }}
                  {{- else }}
                  number: {{ $svcPort }}
                  {{- end }}
              {{- else }}
              serviceName: {{ $svcName }}
              servicePort: {{ $svcPort }}
              {{- end }}
          {{- end }}
    {{- end }}
  {{- if .Values.ingress.extraRules }}
    {{- toYaml .Values.ingress.extraRules | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}