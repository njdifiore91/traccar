{{- $component := required "Component name is required" .component -}}
{{- $namespace := required "Namespace is required" .namespace -}}
{{- $labels := .labels | default dict -}}
{{- $podSelector := required "Pod selector is required" .podSelector -}}
{{- $discoveryNamespace := .discoveryNamespace | default "infrastructure" -}}
{{- $discoverySelector := .discoverySelector | default (dict "app" "consul") -}}
{{- $discoveryPort := .discoveryPort | default 8500 -}}
{{- $discoveryProtocol := .discoveryProtocol | default "TCP" -}}

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
