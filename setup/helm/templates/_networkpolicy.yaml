{{- /*
Template for creating a NetworkPolicy that allows communication with the message broker

Parameters:
  - name: Name of the NetworkPolicy (default: "allow-message-broker")
  - component: Component/service name (required)
  - namespace: Namespace where the policy is applied (required)
  - labels: Labels to apply to the NetworkPolicy (optional)
  - podSelector: Pod selector for the policy (required)
  - brokerNamespace: Namespace where the message broker is deployed (default: "infrastructure")
  - brokerSelector: Pod selector for the message broker (default: {"app": "kafka"})
  - brokerPort: Port of the message broker (default: 9092)
  - brokerProtocol: Protocol used by the message broker (default: "TCP")
*/}}

{{- define "traccar.allowMessageBroker" -}}
{{- $name := .name | default "allow-message-broker" -}}
{{- $component := required "Component name is required" .component -}}
{{- $namespace := required "Namespace is required" .namespace -}}
{{- $labels := .labels | default dict -}}
{{- $podSelector := required "Pod selector is required" .podSelector -}}
{{- $brokerNamespace := .brokerNamespace | default "infrastructure" -}}
{{- $brokerSelector := .brokerSelector | default (dict "app" "kafka") -}}
{{- $brokerPort := .brokerPort | default 9092 -}}
{{- $brokerProtocol := .brokerProtocol | default "TCP" -}}

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}
  namespace: {{ $namespace }}
  labels:
    {{- include "traccar.labels" (dict "labels" $labels "component" $component) | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  podSelector:
    {{- toYaml $podSelector | nindent 4 }}
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          name: {{ $brokerNamespace }}
      podSelector:
        matchLabels:
          {{- toYaml $brokerSelector | nindent 10 }}
    ports:
    - protocol: {{ $brokerProtocol }}
      port: {{ $brokerPort }}
{{- end -}}

{{- /*
