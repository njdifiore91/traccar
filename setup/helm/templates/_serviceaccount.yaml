{{- /*
Template for creating Kubernetes ServiceAccounts for Traccar microservices.

This template creates a ServiceAccount with configurable annotations for cloud provider IAM integration,
imagePullSecrets for private registry access, and consistent naming conventions.

Parameters:
  - .Values.serviceAccount: The ServiceAccount configuration object
  - .Values.serviceAccount.create: Whether to create a ServiceAccount (default: true)
  - .Values.serviceAccount.name: The name of the ServiceAccount (default: release-name-component)
  - .Values.serviceAccount.annotations: Annotations to add to the ServiceAccount (for cloud IAM roles)
  - .Values.serviceAccount.labels: Additional labels to add to the ServiceAccount
  - .Values.serviceAccount.imagePullSecrets: List of imagePullSecrets for private registry access
  - .Values.serviceAccount.automountServiceAccountToken: Whether to automount the service account token (default: true)
  - .Values.serviceAccount.dbMigration: Configuration for database migration ServiceAccount
  - .Values.serviceAccount.dbMigration.create: Whether to create a separate ServiceAccount for DB migrations (default: false)
  - .Values.serviceAccount.dbMigration.name: The name of the DB migration ServiceAccount (default: release-name-component-migration)
  - .Values.serviceAccount.dbMigration.annotations: Annotations for the DB migration ServiceAccount
  - .Values.serviceAccount.dbMigration.labels: Additional labels for the DB migration ServiceAccount

Usage:
  {{- include "traccar.serviceAccount" (dict "Values" .Values "Release" .Release "Chart" .Chart) -}}
*/}}

{{- define "traccar.serviceAccount" -}}
{{- $serviceAccountValues := .Values.serviceAccount -}}
{{- if $serviceAccountValues.create -}}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $serviceAccountValues.name | default (printf "%s-%s" .Release.Name .Chart.Name) }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/part-of: traccar
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    {{- if $serviceAccountValues.labels }}
    {{- toYaml $serviceAccountValues.labels | nindent 4 }}
    {{- end }}
  {{- with $serviceAccountValues.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if $serviceAccountValues.automountServiceAccountToken }}
  automountServiceAccountToken: {{ $serviceAccountValues.automountServiceAccountToken }}
  {{- end }}
  {{- with $serviceAccountValues.imagePullSecrets }}
  imagePullSecrets:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}

{{- if and $serviceAccountValues.dbMigration $serviceAccountValues.dbMigration.create -}}
---
# Separate ServiceAccount with restricted permissions for database migrations
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $serviceAccountValues.dbMigration.name | default (printf "%s-%s-migration" .Release.Name .Chart.Name) }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/part-of: traccar
    app.kubernetes.io/component: db-migration
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    {{- if $serviceAccountValues.dbMigration.labels }}
    {{- toYaml $serviceAccountValues.dbMigration.labels | nindent 4 }}
    {{- end }}
  {{- with $serviceAccountValues.dbMigration.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  automountServiceAccountToken: true
  {{- with $serviceAccountValues.imagePullSecrets }}
  imagePullSecrets:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}

{{- if and $serviceAccountValues.dbMigration $serviceAccountValues.dbMigration.create -}}
---
# Role for database migration with restricted permissions
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $serviceAccountValues.dbMigration.name | default (printf "%s-%s-migration" .Release.Name .Chart.Name) }}-role
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/part-of: traccar
    app.kubernetes.io/component: db-migration
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
rules:
  # Minimal permissions required for database migrations
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
    # Allow access to database credentials stored in secrets
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list"]
    # Allow access to migration configuration stored in configmaps
---
# RoleBinding for database migration ServiceAccount
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $serviceAccountValues.dbMigration.name | default (printf "%s-%s-migration" .Release.Name .Chart.Name) }}-rolebinding
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/part-of: traccar
    app.kubernetes.io/component: db-migration
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $serviceAccountValues.dbMigration.name | default (printf "%s-%s-migration" .Release.Name .Chart.Name) }}-role
subjects:
  - kind: ServiceAccount
    name: {{ $serviceAccountValues.dbMigration.name | default (printf "%s-%s-migration" .Release.Name .Chart.Name) }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end -}}