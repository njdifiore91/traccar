# Notification Service configuration
notificationService:
  enabled: true
  nameOverride: ""
  fullnameOverride: ""
  
  # Deployment specific settings
  replicaCount: 2
  
  # Image settings (overrides global)
  image:
    repository: traccar/notification
    tag: ""
    pullPolicy: ""
  
  # Service settings
  service:
    type: ClusterIP
    port: 8083
  
  # Resource allocation (overrides global)
  resources:
    requests:
      cpu: 300m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  
  # Autoscaling configuration
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  
  # Health check configuration
  livenessProbe:
    httpGet:
      path: /health/liveness
      port: 8083
    initialDelaySeconds: 60
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  
  readinessProbe:
    httpGet:
      path: /health/readiness
      port: 8083
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  
  # Notification channel configuration
  channels:
    email:
      enabled: true
      host: "smtp.example.com"
      port: 587
      starttls: true
      from: "traccar@example.com"
      # auth credentials should be provided via secret
      existingSecret: "email-credentials"
      existingSecretUsernameKey: "username"
      existingSecretPasswordKey: "password"
    sms:
      enabled: false
      provider: "aws" # Options: aws, twilio, etc.
      # Provider-specific settings
      aws:
        region: "us-east-1"
        # credentials should be provided via secret
        existingSecret: "aws-credentials"
        existingSecretAccessKeyKey: "access-key"
        existingSecretSecretKeyKey: "secret-key"
    push:
      enabled: false
      provider: "firebase"
      # Provider-specific settings
      firebase:
        # credentials should be provided via secret
        existingSecret: "firebase-credentials"
        existingSecretKeyKey: "service-account-key"
  
  # Environment variables
  env: []
  
  # ConfigMap for configuration
  configMap:
    enabled: true
    data: {}
  
  # Additional pod annotations
  podAnnotations: {}
  
  # Additional pod labels
  podLabels: {}
  
  # Node selector, tolerations, and affinity (overrides global)
  nodeSelector: {}
  tolerations: []
  affinity: {}

# API Gateway Service configuration
apiGatewayService:
  enabled: true
  nameOverride: ""
  fullnameOverride: ""
  
  # Deployment specific settings
  replicaCount: 2
  
  # Image settings (overrides global)
  image:
    repository: traccar/api-gateway
    tag: ""
    pullPolicy: ""
  
  # Service settings
  service:
    type: ClusterIP
    port: 8080
  
  # Ingress configuration
  ingress:
    enabled: true
    className: "nginx"
    annotations: {}
    hosts:
      - host: "api.traccar.example.com"
        paths:
          - path: /
            pathType: Prefix
    tls: []
    # - secretName: api-traccar-tls
    #   hosts:
    #     - api.traccar.example.com
  
  # Resource allocation (overrides global)
  resources:
    requests:
      cpu: 300m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  
  # Autoscaling configuration
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  
  # Health check configuration
  livenessProbe:
    httpGet:
      path: /health/liveness
      port: 8080
    initialDelaySeconds: 60
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  
  readinessProbe:
    httpGet:
      path: /health/readiness
      port: 8080
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  
  # API Gateway specific configuration
  api:
    # Authentication configuration
    auth:
      type: "jwt" # Options: jwt, oauth2, basic
      jwt:
        secret: ""
        # or use existing secret
        existingSecret: "jwt-secret"
        existingSecretKey: "jwt-key"
      # CORS configuration
      cors:
        enabled: true
        allowedOrigins:
          - "*"
        allowedMethods:
          - "GET"
          - "POST"
          - "PUT"
          - "DELETE"
          - "OPTIONS"
        allowedHeaders:
          - "*"
        allowCredentials: true
        maxAge: 3600
  
  # WebSocket configuration
  websocket:
    enabled: true
    path: "/api/socket"
  
  # Environment variables
  env: []
  
  # ConfigMap for configuration
  configMap:
    enabled: true
    data: {}
  
  # Additional pod annotations
  podAnnotations: {}
  
  # Additional pod labels
  podLabels: {}
  
  # Node selector, tolerations, and affinity (overrides global)
  nodeSelector: {}
  tolerations: []
  affinity: {}

