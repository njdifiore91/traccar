# Infrastructure components configuration
infrastructure:
  # Kafka configuration
  kafka:
    enabled: false # Set to true to deploy Kafka with this chart
    # If false, external Kafka should be configured in global.messageBroker.kafka
    # For detailed Kafka configuration, refer to the Kafka Helm chart values
    # This is just a minimal example
    replicas: 3
    resources:
      requests:
        cpu: 1000m
        memory: 2Gi
      limits:
        cpu: 2000m
        memory: 4Gi
    persistence:
      enabled: true
      size: 20Gi
    zookeeper:
      enabled: true
      replicaCount: 3
      persistence:
        enabled: true
        size: 5Gi
  
  # RabbitMQ configuration
  rabbitmq:
    enabled: false # Set to true to deploy RabbitMQ with this chart
    # If false, external RabbitMQ should be configured in global.messageBroker.rabbitmq
    # For detailed RabbitMQ configuration, refer to the RabbitMQ Helm chart values
    # This is just a minimal example
    replicaCount: 3
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: 1000m
        memory: 2Gi
    persistence:
      enabled: true
      size: 10Gi
  
  # Redis configuration
  redis:
    enabled: false # Set to true to deploy Redis with this chart
    # If false, external Redis should be configured in global.cache.redis
    # For detailed Redis configuration, refer to the Redis Helm chart values
    # This is just a minimal example
    architecture: replication
    master:
      persistence:
        enabled: true
        size: 5Gi
    replica:
      replicaCount: 2
      persistence:
        enabled: true
        size: 5Gi
  
  # Consul configuration
  consul:
    enabled: false # Set to true to deploy Consul with this chart
    # If false, external Consul should be configured in global.serviceDiscovery.consul
    # For detailed Consul configuration, refer to the Consul Helm chart values
    # This is just a minimal example
    server:
      replicas: 3
      storage: 10Gi
    client:
      enabled: true

