# Global Traccar Helm Chart Values
# This file contains the default configuration values for all Traccar microservices

# Global settings that apply to all services
global:
  # Environment settings
  environment: production # Options: development, staging, production
  
  # Image settings
  image:
    registry: docker.io
    repository: traccar
    tag: latest
    pullPolicy: IfNotPresent
    # Credentials for private registry
    pullSecrets: []
    # - name: registry-credentials
  
  # Common labels to be applied to all resources
  labels: {}
  
  # Common annotations to be applied to all resources
  annotations: {}
  
  # Network settings
  network:
    # Domain name for ingress resources
    domain: traccar.example.com
    # TLS configuration
    tls:
      enabled: true
      secretName: traccar-tls
  
  # Database configuration
  database:
    type: postgresql # Options: postgresql, mysql, h2
    host: "traccar-db"
    port: 5432
    name: "traccar"
    user: "traccar"
    # password should be provided via secret
    existingSecret: "traccar-db-credentials"
    existingSecretKey: "password"
    # Connection pool settings
    pool:
      maxSize: 25
      minIdle: 5
      idleTimeout: 600000
      maxLifetime: 1800000
  
  # Message broker configuration
  messageBroker:
    type: kafka # Options: kafka, rabbitmq
    # Kafka settings
    kafka:
      bootstrapServers: "kafka:9092"
      # Security settings
      security:
        enabled: false
        # authentication:
        #   mechanism: PLAIN
        #   username: "kafka"
        #   password: "kafka-password"
        # tls:
        #   enabled: false
        #   truststore: "/path/to/truststore.jks"
        #   truststorePassword: "password"
    # RabbitMQ settings
    rabbitmq:
      host: "rabbitmq"
      port: 5672
      username: "guest"
      # password should be provided via secret
      existingSecret: "rabbitmq-credentials"
      existingSecretKey: "password"
      virtualHost: "/"
  
  # Service discovery configuration
  serviceDiscovery:
    type: kubernetes # Options: kubernetes, consul
    # Consul settings
    consul:
      host: "consul"
      port: 8500
  
  # Distributed cache configuration
  cache:
    type: redis # Options: redis, hazelcast
    redis:
      host: "redis"
      port: 6379
      # password should be provided via secret
      existingSecret: "redis-credentials"
      existingSecretKey: "password"
  
  # Common resource defaults
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  
  # Pod security context
  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
  
  # Container security context
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    capabilities:
      drop:
        - ALL
  
  # Node selector for all pods
  nodeSelector: {}
  
  # Tolerations for all pods
  tolerations: []
  
  # Affinity for all pods
  affinity: {}
  
  # Priority class name
  priorityClassName: ""
  
  # Pod disruption budget
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
    # maxUnavailable: 1

# Protocol Service configuration
protocolService:
  enabled: true
  nameOverride: ""
  fullnameOverride: ""
  
  # Deployment specific settings
  replicaCount: 2
  
  # Image settings (overrides global)
  image:
    repository: traccar/protocol
    tag: ""
    pullPolicy: ""
  
  # Service settings
  service:
    type: ClusterIP
    # Protocol ports configuration
    ports:
      - name: http
        port: 8090
        targetPort: 8090
        protocol: TCP
      - name: tcp-default
        port: 5000
        targetPort: 5000
        protocol: TCP
      - name: udp-default
        port: 5000
        targetPort: 5000
        protocol: UDP
      # Add additional protocol ports as needed
  
  # Protocol-specific configuration
  protocols:
    enabled:
      - name: default
        port: 5000
        type: tcp
      # Add more protocols as needed
  
  # Resource allocation (overrides global)
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  
  # Autoscaling configuration
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
    # Custom metrics
    customMetrics: []
    # - type: Pods
    #   pods:
    #     metric:
    #       name: active_connections
    #     target:
    #       type: AverageValue
    #       averageValue: 1000
  
  # Health check configuration
  livenessProbe:
    httpGet:
      path: /health/liveness
      port: 8090
    initialDelaySeconds: 60
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  
  readinessProbe:
    httpGet:
      path: /health/readiness
      port: 8090
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  
  # Environment variables
  env: []
  # - name: PROTOCOL_DEBUG
  #   value: "false"
  
  # ConfigMap for configuration
  configMap:
    enabled: true
    data: {}
    # protocol.conf: |
    #   protocol.debug=false
  
  # Persistence configuration
  persistence:
    enabled: false
    # storageClass: ""
    # accessMode: ReadWriteOnce
    # size: 1Gi
    # annotations: {}
  
  # Additional pod annotations
  podAnnotations: {}
  
  # Additional pod labels
  podLabels: {}
  
  # Node selector, tolerations, and affinity (overrides global)
  nodeSelector: {}
  tolerations: []
  affinity: {}

