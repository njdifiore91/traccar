{{- /*
Service for the Position Processing Service.
Exposes the Position Service API on port 8081 (configurable) for inter-service communication.
This service allows other components to communicate with the Position Service for position data processing.
*/}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "position.fullname" . }}
  labels:
    {{- include "position.labels" . | nindent 4 }}
    app.kubernetes.io/component: position-service
    app.kubernetes.io/part-of: traccar
  annotations:
    # Standard monitoring annotations
    prometheus.io/scrape: "true"
    prometheus.io/port: "{{ .Values.service.port | default "8081" }}"
    prometheus.io/path: "/actuator/prometheus"
    
    # Service discovery annotations if enabled
    {{- if .Values.serviceDiscovery.enabled }}
    service.traccar.io/name: "position-service"
    service.traccar.io/version: "{{ .Chart.AppVersion }}"
    {{- end }}
    
    # Custom annotations from values.yaml
    {{- with .Values.service.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  # Default to ClusterIP if not specified
  type: {{ .Values.service.type | default "ClusterIP" }}
  ports:
    # Main API port
    - port: {{ .Values.service.port | default 8081 }}
      targetPort: http-api
      protocol: TCP
      name: http-api
      
    # Optional metrics port
    {{- if .Values.metrics.enabled }}
    - port: {{ .Values.metrics.port | default 8091 }}
      targetPort: metrics
      protocol: TCP
      name: metrics
    {{- end }}
  selector:
    {{- include "position.selectorLabels" . | nindent 4 }}