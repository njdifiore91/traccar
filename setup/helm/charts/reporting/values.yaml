# Default values for Traccar Reporting Service Helm chart
# This is a YAML-formatted file.

## Image configuration
image:
  repository: traccar/reporting-service
  tag: latest
  pullPolicy: IfNotPresent

## Number of replicas
replicaCount: 1

## Resource allocation
resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1Gi

## Autoscaling configuration
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
  # Custom metrics for scaling
  # customMetrics:
  # - type: Pods
  #   pods:
  #     metric:
  #       name: concurrent_report_jobs
  #     target:
  #       type: AverageValue
  #       averageValue: 5
  # Scaling behavior configuration
  # behavior:
  #   scaleUp:
  #     stabilizationWindowSeconds: 60
  #     policies:
  #     - type: Percent
  #       value: 100
  #       periodSeconds: 60
  #   scaleDown:
  #     stabilizationWindowSeconds: 300
  #     policies:
  #     - type: Percent
  #       value: 10
  #       periodSeconds: 120

## Service configuration
service:
  type: ClusterIP
  port: 8084
  annotations: {}

## Pod annotations
podAnnotations: {}

## Pod security context
podSecurityContext: {}

## Container security context
securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  allowPrivilegeEscalation: false

## Node selector
nodeSelector: {}

## Tolerations
tolerations: []

## Affinity
affinity: {}

## Liveness probe
livenessProbe:
  httpGet:
    path: /health/liveness
    port: 8084
  initialDelaySeconds: 60
  periodSeconds: 15
  timeoutSeconds: 5
  failureThreshold: 3

## Readiness probe
readinessProbe:
  httpGet:
    path: /health/readiness
    port: 8084
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

## Report generation configuration
reporting:
  # Maximum concurrent report generation jobs
  maxConcurrentJobs: 5
  # Default report formats
  formats:
    - PDF
    - CSV
    - XLSX
  # Report generation timeout in seconds
  generationTimeout: 300
  # Enable scheduled reports
  scheduledReports: true
  # Temporary storage path for report generation
  tempStoragePath: /tmp/reports
  # Maximum report size in MB
  maxReportSize: 50

## Environment variables
env:
  # JVM options
  JAVA_OPTS: "-Xms256m -Xmx512m"
  # Timezone configuration
  TZ: "UTC"

## ConfigMap data
configMapData:
  # Application configuration
  application.yml: |
    spring:
      application:
        name: reporting-service
      jackson:
        serialization:
          WRITE_DATES_AS_TIMESTAMPS: false
      kafka:
        bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
        consumer:
          group-id: reporting-service
          auto-offset-reset: earliest

    server:
      port: 8084
      shutdown: graceful

    management:
      endpoints:
        web:
          exposure:
            include: health,info,prometheus
      endpoint:
        health:
          probes:
            enabled: true
          show-details: always
      health:
        livenessState:
          enabled: true
        readinessState:
          enabled: true

    logging:
      level:
        root: INFO
        org.traccar: INFO

## Persistence configuration
persistence:
  enabled: false
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 1Gi

## Service account
serviceAccount:
  create: true
  annotations: {}
  name: ""