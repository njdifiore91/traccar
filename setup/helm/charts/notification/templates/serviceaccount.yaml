{{- if .Values.serviceAccount.create -}}
# ServiceAccount for the Notification Service
# This defines the identity used by the Notification Service pods
#
# SECURITY CONSIDERATIONS:
# - This ServiceAccount follows the principle of least privilege
# - Permissions are granted via Role/ClusterRole and RoleBinding/ClusterRoleBinding resources
# - The ServiceAccount is used for authentication of the Notification Service with the Kubernetes API
# - It's also used for service-to-service authentication in the microservices architecture
# - For enhanced security, consider setting automountServiceAccountToken to false and mounting tokens manually
#
# RBAC CONFIGURATION:
# Permissions are granted to this ServiceAccount via Role/ClusterRole and
# RoleBinding/ClusterRoleBinding resources, which should be defined in separate files:
# - templates/role.yaml: Defines permissions for resources within the namespace
# - templates/rolebinding.yaml: Binds the Role to this ServiceAccount
# - templates/clusterrole.yaml: Defines cluster-wide permissions (if needed)
# - templates/clusterrolebinding.yaml: Binds the ClusterRole to this ServiceAccount
#
# PRINCIPLE OF LEAST PRIVILEGE:
# The Notification Service requires permissions for:
# - Accessing secrets containing notification channel credentials
# - Creating and updating notification-related resources
# - Reading configuration and user data needed for notifications
# - Accessing message broker resources for consuming events
#
# All RBAC resources should follow the principle of least privilege by granting
# only the specific permissions required for the Notification Service to function
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "notification.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "notification.labels" . | nindent 4 }}
    app.kubernetes.io/component: notification-service
    app.kubernetes.io/part-of: traccar
    # Additional labels for audit and management
    security.traccar.org/audit: "enabled"
    security.traccar.org/managed-by: "helm"
  annotations:
    # Default security annotations
    security.traccar.org/description: "ServiceAccount for Notification Service with least privilege access"
    {{- if .Values.serviceAccount.annotations }}
    {{- toYaml .Values.serviceAccount.annotations | nindent 4 }}
    {{- end }}
{{- if .Values.serviceAccount.automountServiceAccountToken }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
{{- if .Values.imagePullSecrets }}
imagePullSecrets:
  {{- range .Values.imagePullSecrets }}
  - name: {{ . }}
  {{- end }}
{{- end }}
{{- end }}