apiVersion: v2
name: api-gateway
version: 1.0.0
type: application
description: |
  API Gateway Service for the Traccar GPS tracking platform microservices architecture.
  
  This service provides a unified access point to all backend services, managing external API access
  and WebSocket connections. It handles authentication, request routing, and real-time updates
  through WebSocket connections to clients. The API Gateway maintains backward compatibility
  with existing client applications while routing requests to the appropriate microservices.

  Key responsibilities:
  - External REST API endpoint management
  - WebSocket connections for real-time updates
  - Authentication and authorization
  - Request routing to appropriate backend services
  - API security and throttling

kubeVersion: ">= 1.25.0"
appVersion: "1.0.0"
maintainers:
