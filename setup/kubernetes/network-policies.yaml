# Database Network Policy
- apiVersion: networking.k8s.io/v1
  kind: NetworkPolicy
  metadata:
    name: database-policy
    namespace: traccar
  spec:
    podSelector:
      matchLabels:
        app: database
    policyTypes:
    - Ingress
    - Egress
    ingress:
    # Allow ingress from all microservices that need database access
    - from:
      - podSelector:
          matchLabels:
            app: position-service
      - podSelector:
          matchLabels:
            app: event-service
      - podSelector:
          matchLabels:
            app: notification-service
      - podSelector:
          matchLabels:
            app: reporting-service
      - podSelector:
          matchLabels:
            app: api-gateway
      ports:
      - protocol: TCP
        port: 3306
    egress:
    # Allow egress to DNS
    - to:
      - namespaceSelector:
          matchLabels:
            name: kube-system
        podSelector:
          matchLabels:
            k8s-app: kube-dns
      ports:
      - protocol: UDP
        port: 53
      - protocol: TCP
        port: 53
    # Allow egress to metrics server
    - to:
      - podSelector:
          matchLabels:
            app: prometheus
      ports:
      - protocol: TCP
        port: 9090

# Message Broker Network Policy (Kafka/RabbitMQ)
- apiVersion: networking.k8s.io/v1
  kind: NetworkPolicy
  metadata:
    name: message-broker-policy
    namespace: traccar
  spec:
    podSelector:
      matchExpressions:
      - key: app
        operator: In
        values: ["kafka", "rabbitmq"]
    policyTypes:
    - Ingress
    - Egress
    ingress:
    # Allow ingress from all microservices that need message broker access
    - from:
      - podSelector:
          matchLabels:
            app: protocol-service
      - podSelector:
          matchLabels:
            app: position-service
      - podSelector:
          matchLabels:
            app: event-service
      - podSelector:
          matchLabels:
            app: notification-service
      - podSelector:
          matchLabels:
            app: reporting-service
      - podSelector:
          matchLabels:
            app: state-service
      - podSelector:
          matchLabels:
            app: api-gateway
      ports:
      - protocol: TCP
        port: 9092  # Kafka
      - protocol: TCP
        port: 5672  # RabbitMQ AMQP
      - protocol: TCP
        port: 15672 # RabbitMQ Management
    egress:
    # Allow egress to DNS
    - to:
      - namespaceSelector:
          matchLabels:
            name: kube-system
        podSelector:
          matchLabels:
            k8s-app: kube-dns
      ports:
      - protocol: UDP
        port: 53
      - protocol: TCP
        port: 53
    # Allow egress to ZooKeeper (for Kafka)
    - to:
      - podSelector:
          matchLabels:
            app: zookeeper
      ports:
      - protocol: TCP
        port: 2181
    # Allow egress to metrics server
    - to:
      - podSelector:
          matchLabels:
            app: prometheus
      ports:
      - protocol: TCP
        port: 9090

