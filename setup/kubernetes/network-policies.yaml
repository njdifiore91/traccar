# Monitoring Network Policy
- apiVersion: networking.k8s.io/v1
  kind: NetworkPolicy
  metadata:
    name: monitoring-policy
    namespace: traccar
  spec:
    podSelector:
      matchLabels:
        app: prometheus
    policyTypes:
    - Ingress
    - Egress
    ingress:
    # Allow ingress from all microservices for metrics collection
    - from:
      - podSelector: {}
      ports:
      - protocol: TCP
        port: 9090
    egress:
    # Allow egress to all microservices for scraping metrics
    - to:
      - podSelector: {}
      ports:
      - protocol: TCP
        port: 8080  # Common metrics port
    # Allow egress to DNS
    - to:
      - namespaceSelector:
          matchLabels:
            name: kube-system
        podSelector:
          matchLabels:
            k8s-app: kube-dns
      ports:
      - protocol: UDP
        port: 53
      - protocol: TCP
        port: 53