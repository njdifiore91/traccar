---
# ConfigMap for Reporting Service
apiVersion: v1
kind: ConfigMap
metadata:
  name: reporting-service-config
  labels:
    app: reporting-service
data:
  application.yml: |
    server:
      port: 8084
    
    spring:
      application:
        name: reporting-service
      
      # Database configuration
      datasource:
        url: ${JDBC_URL:jdbc:postgresql://postgres:5432/traccar}
        username: ${DB_USERNAME:postgres}
        password: ${DB_PASSWORD:postgres}
        driver-class-name: org.postgresql.Driver
        hikari:
          maximum-pool-size: 10
          minimum-idle: 2
          idle-timeout: 30000
          connection-timeout: 20000
      
      # Message broker configuration
      kafka:
        bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
        consumer:
          group-id: reporting-service
          auto-offset-reset: earliest
        producer:
          key-serializer: org.apache.kafka.common.serialization.StringSerializer
          value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    
    # Report generation settings
    reports:
      # Maximum concurrent report generation jobs
      max-concurrent-jobs: 5
      # Default report formats
      formats: [PDF, CSV, XLSX]
      # Report template directory
      template-dir: /app/templates
      # Report output directory
      output-dir: /app/reports
      # Default report retention period in days
      retention-days: 30
    
    # Health check configuration
    management:
      endpoints:
        web:
          exposure:
            include: health,info,metrics,prometheus
      endpoint:
        health:
          show-details: always
          probes:
            enabled: true
      health:
        livenessState:
          enabled: true
        readinessState:
          enabled: true

---
# Deployment for Reporting Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reporting-service
  labels:
    app: reporting-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reporting-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: reporting-service
    spec:
      containers:
      - name: reporting-service
        image: ${REPORTING_SERVICE_IMAGE:-traccar/reporting-service:latest}
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8084
        env:
        - name: JAVA_OPTS
          value: "-Xms256m -Xmx768m -XX:+UseG1GC"
        - name: KAFKA_BOOTSTRAP_SERVERS
          valueFrom:
            configMapKeyRef:
              name: kafka-config
              key: bootstrap-servers
              optional: true
        - name: JDBC_URL
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: url
        - name: DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: username
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: password
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        volumeMounts:
        - name: config-volume
          mountPath: /app/config
        - name: templates-volume
          mountPath: /app/templates
        - name: reports-volume
          mountPath: /app/reports
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8084
          initialDelaySeconds: 60
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8084
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
      volumes:
      - name: config-volume
        configMap:
          name: reporting-service-config
      - name: templates-volume
        configMap:
          name: report-templates
          optional: true
      - name: reports-volume
        emptyDir: {}

---
# Service for Reporting Service
apiVersion: v1
kind: Service
metadata:
  name: reporting-service
  labels:
    app: reporting-service
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8084"
    prometheus.io/path: "/actuator/prometheus"
spec:
  selector:
    app: reporting-service
  ports:
  - name: http
    port: 8084
    targetPort: 8084
  type: ClusterIP

---
# HorizontalPodAutoscaler for Reporting Service
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: reporting-service-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: reporting-service
  minReplicas: 1
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 100
        periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 10
        periodSeconds: 120