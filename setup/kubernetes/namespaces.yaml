---
# Infrastructure Namespace (for shared components like message broker, service discovery, etc.)
apiVersion: v1
kind: Namespace
metadata:
  name: infrastructure
  labels:
    app.kubernetes.io/part-of: traccar
    app.kubernetes.io/component: shared-infrastructure
    environment: production
  annotations:
    monitoring.traccar.org/scrape: "true"
---
# Resource Quota for Infrastructure Namespace
apiVersion: v1
kind: ResourceQuota
metadata:
  name: infrastructure-quota
  namespace: infrastructure
spec:
  hard:
    requests.cpu: "12"
    requests.memory: 16Gi
    limits.cpu: "24"
    limits.memory: 32Gi
    pods: "30"
    services: "15"
    configmaps: "50"
    secrets: "50"
    persistentvolumeclaims: "20"