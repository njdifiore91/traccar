# Traccar Microservices Infrastructure Components
# This manifest contains all the shared infrastructure components required by Traccar microservices
# Including: Kafka, ZooKeeper, Redis, and Service Registry (Consul)

---
# ============================================================================
# Kafka StatefulSet and related resources
# ============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-config
  labels:
    app: kafka
    component: message-broker
data:
  server.properties: |
    broker.id=${HOSTNAME##*-}
    listeners=PLAINTEXT://:9092,CONTROLLER://:9093
    advertised.listeners=PLAINTEXT://kafka-${HOSTNAME##*-}.kafka-headless.infrastructure.svc.cluster.local:9092
    listener.security.protocol.map=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
    controller.quorum.voters=0@kafka-0.kafka-headless.infrastructure.svc.cluster.local:9093,1@kafka-1.kafka-headless.infrastructure.svc.cluster.local:9093,2@kafka-2.kafka-headless.infrastructure.svc.cluster.local:9093
    controller.listener.names=CONTROLLER
    process.roles=broker,controller
    inter.broker.listener.name=PLAINTEXT
    num.network.threads=3
    num.io.threads=8
    socket.send.buffer.bytes=102400
    socket.receive.buffer.bytes=102400
    socket.request.max.bytes=104857600
    log.dirs=/var/lib/kafka/data
    num.partitions=8
    num.recovery.threads.per.data.dir=1
    offsets.topic.replication.factor=3
    transaction.state.log.replication.factor=3
    transaction.state.log.min.isr=2
    log.retention.hours=168
    log.segment.bytes=1073741824
    log.retention.check.interval.ms=300000
    zookeeper.connect=zookeeper-0.zookeeper-headless.infrastructure.svc.cluster.local:2181,zookeeper-1.zookeeper-headless.infrastructure.svc.cluster.local:2181,zookeeper-2.zookeeper-headless.infrastructure.svc.cluster.local:2181
    zookeeper.connection.timeout.ms=18000
    group.initial.rebalance.delay.ms=0
    auto.create.topics.enable=true
    delete.topic.enable=true

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  labels:
    app: kafka
    component: message-broker
spec:
  serviceName: kafka-headless
  replicas: 3
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
        component: message-broker
    spec:
      terminationGracePeriodSeconds: 120
      containers:
      - name: kafka
        image: confluentinc/cp-kafka:7.4.0
        imagePullPolicy: IfNotPresent
        ports:
        - name: kafka
          containerPort: 9092
        - name: controller
          containerPort: 9093
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 2
            memory: 2Gi
        env:
        - name: KAFKA_HEAP_OPTS
          value: "-Xmx1536M -Xms1536M"
        - name: KAFKA_OPTS
          value: "-Dlogging.level=INFO"
        volumeMounts:
        - name: data
          mountPath: /var/lib/kafka/data
        - name: config
          mountPath: /etc/kafka/server.properties
          subPath: server.properties
        livenessProbe:
          tcpSocket:
            port: 9092
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
        readinessProbe:
          tcpSocket:
            port: 9092
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
      volumes:
      - name: config
        configMap:
          name: kafka-config
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: standard
      resources:
        requests:
          storage: 20Gi

---
apiVersion: v1
kind: Service
metadata:
  name: kafka-headless
  labels:
    app: kafka
    component: message-broker
spec:
  clusterIP: None
  ports:
  - port: 9092
    name: kafka
  - port: 9093
    name: controller
  selector:
    app: kafka

---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  labels:
    app: kafka
    component: message-broker
spec:
  ports:
  - port: 9092
    name: kafka
  selector:
    app: kafka

---
# ============================================================================
# ZooKeeper StatefulSet and related resources
# ============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: zookeeper-config
  labels:
    app: zookeeper
    component: message-broker
data:
  zoo.cfg: |
    tickTime=2000
    initLimit=10
    syncLimit=5
    dataDir=/var/lib/zookeeper/data
    clientPort=2181
    autopurge.snapRetainCount=3
    autopurge.purgeInterval=1
    server.1=zookeeper-0.zookeeper-headless.infrastructure.svc.cluster.local:2888:3888
    server.2=zookeeper-1.zookeeper-headless.infrastructure.svc.cluster.local:2888:3888
    server.3=zookeeper-2.zookeeper-headless.infrastructure.svc.cluster.local:2888:3888

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: zookeeper
  labels:
    app: zookeeper
    component: message-broker
spec:
  serviceName: zookeeper-headless
  replicas: 3
  selector:
    matchLabels:
      app: zookeeper
  template:
    metadata:
      labels:
        app: zookeeper
        component: message-broker
    spec:
      terminationGracePeriodSeconds: 60
      containers:
      - name: zookeeper
        image: zookeeper:3.8.1
        imagePullPolicy: IfNotPresent
        ports:
        - name: client
          containerPort: 2181
        - name: follower
          containerPort: 2888
        - name: leader
          containerPort: 3888
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 500m
            memory: 1Gi
        env:
        - name: ZOO_MY_ID
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
              apiVersion: v1
        - name: ZOO_SERVERS
          value: "server.1=zookeeper-0.zookeeper-headless.infrastructure.svc.cluster.local:2888:3888;2181 server.2=zookeeper-1.zookeeper-headless.infrastructure.svc.cluster.local:2888:3888;2181 server.3=zookeeper-2.zookeeper-headless.infrastructure.svc.cluster.local:2888:3888;2181"
        volumeMounts:
        - name: data
          mountPath: /var/lib/zookeeper/data
        - name: config
          mountPath: /conf/zoo.cfg
          subPath: zoo.cfg
        livenessProbe:
          exec:
            command:
            - sh
            - -c
            - "echo ruok | nc localhost 2181 | grep imok"
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - "echo ruok | nc localhost 2181 | grep imok"
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
      volumes:
      - name: config
        configMap:
          name: zookeeper-config
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: standard
      resources:
        requests:
          storage: 10Gi

---
apiVersion: v1
kind: Service
metadata:
  name: zookeeper-headless
  labels:
    app: zookeeper
    component: message-broker
spec:
  clusterIP: None
  ports:
  - port: 2181
    name: client
  - port: 2888
    name: follower
  - port: 3888
    name: leader
  selector:
    app: zookeeper

---
apiVersion: v1
kind: Service
metadata:
  name: zookeeper
  labels:
    app: zookeeper
    component: message-broker
spec:
  ports:
  - port: 2181
    name: client
  selector:
    app: zookeeper

---
# ============================================================================
# Redis StatefulSet and related resources
# ============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
  labels:
    app: redis
    component: cache
data:
  redis.conf: |
    bind 0.0.0.0
    protected-mode yes
    port 6379
    tcp-backlog 511
    timeout 0
    tcp-keepalive 300
    daemonize no
    supervised no
    pidfile /var/run/redis_6379.pid
    loglevel notice
    logfile ""
    databases 16
    always-show-logo yes
    save 900 1
    save 300 10
    save 60 10000
    stop-writes-on-bgsave-error yes
    rdbcompression yes
    rdbchecksum yes
    dbfilename dump.rdb
    dir /data
    replica-serve-stale-data yes
    replica-read-only yes
    repl-diskless-sync no
    repl-diskless-sync-delay 5
    repl-disable-tcp-nodelay no
    replica-priority 100
    lazyfree-lazy-eviction no
    lazyfree-lazy-expire no
    lazyfree-lazy-server-del no
    replica-lazy-flush no
    appendonly yes
    appendfilename "appendonly.aof"
    appendfsync everysec
    no-appendfsync-on-rewrite no
    auto-aof-rewrite-percentage 100
    auto-aof-rewrite-min-size 64mb
    aof-load-truncated yes
    aof-use-rdb-preamble yes
    lua-time-limit 5000
    slowlog-log-slower-than 10000
    slowlog-max-len 128
    latency-monitor-threshold 0
    notify-keyspace-events ""
    hash-max-ziplist-entries 512
    hash-max-ziplist-value 64
    list-max-ziplist-size -2
    list-compress-depth 0
    set-max-intset-entries 512
    zset-max-ziplist-entries 128
    zset-max-ziplist-value 64
    hll-sparse-max-bytes 3000
    stream-node-max-bytes 4096
    stream-node-max-entries 100
    activerehashing yes
    client-output-buffer-limit normal 0 0 0
    client-output-buffer-limit replica 256mb 64mb 60
    client-output-buffer-limit pubsub 32mb 8mb 60
    hz 10
    dynamic-hz yes
    aof-rewrite-incremental-fsync yes
    rdb-save-incremental-fsync yes
    maxmemory 1gb
    maxmemory-policy allkeys-lru

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  labels:
    app: redis
    component: cache
spec:
  serviceName: redis-headless
  replicas: 3
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
        component: cache
    spec:
      terminationGracePeriodSeconds: 30
      containers:
      - name: redis
        image: redis:7.0-alpine
        imagePullPolicy: IfNotPresent
        command:
        - redis-server
        - /etc/redis/redis.conf
        ports:
        - name: redis
          containerPort: 6379
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 500m
            memory: 1Gi
        volumeMounts:
        - name: data
          mountPath: /data
        - name: config
          mountPath: /etc/redis/redis.conf
          subPath: redis.conf
        livenessProbe:
          exec:
            command:
            - sh
            - -c
            - "redis-cli ping"
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - "redis-cli ping"
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
      volumes:
      - name: config
        configMap:
          name: redis-config
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: standard
      resources:
        requests:
          storage: 10Gi

---
apiVersion: v1
kind: Service
metadata:
  name: redis-headless
  labels:
    app: redis
    component: cache
spec:
  clusterIP: None
  ports:
  - port: 6379
    name: redis
  selector:
    app: redis

---
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    app: redis
    component: cache
spec:
  ports:
  - port: 6379
    name: redis
  selector:
    app: redis

---
# ============================================================================
# Service Registry (Consul) StatefulSet and related resources
# ============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: consul-config
  labels:
    app: consul
    component: service-registry
data:
  consul.json: |
    {
      "datacenter": "traccar",
      "data_dir": "/consul/data",
      "log_level": "INFO",
      "node_name": "${HOSTNAME}",
      "server": true,
      "bootstrap_expect": 3,
      "retry_join": ["consul-0.consul-headless.infrastructure.svc.cluster.local", "consul-1.consul-headless.infrastructure.svc.cluster.local", "consul-2.consul-headless.infrastructure.svc.cluster.local"],
      "ui_config": {
        "enabled": true
      },
      "client_addr": "0.0.0.0",
      "ports": {
        "http": 8500,
        "https": -1,
        "grpc": 8502
      },
      "connect": {
        "enabled": true
      },
      "performance": {
        "raft_multiplier": 1
      }
    }

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: consul
  labels:
    app: consul
    component: service-registry
spec:
  serviceName: consul-headless
  replicas: 3
  selector:
    matchLabels:
      app: consul
  template:
    metadata:
      labels:
        app: consul
        component: service-registry
    spec:
      terminationGracePeriodSeconds: 30
      containers:
      - name: consul
        image: hashicorp/consul:1.15.4
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8500
        - name: grpc
          containerPort: 8502
        - name: serflan-tcp
          containerPort: 8301
        - name: serflan-udp
          containerPort: 8301
          protocol: UDP
        - name: serfwan-tcp
          containerPort: 8302
        - name: serfwan-udp
          containerPort: 8302
          protocol: UDP
        - name: server
          containerPort: 8300
        - name: dns-tcp
          containerPort: 8600
        - name: dns-udp
          containerPort: 8600
          protocol: UDP
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 500m
            memory: 1Gi
        env:
        - name: CONSUL_LOCAL_CONFIG
          valueFrom:
            configMapKeyRef:
              name: consul-config
              key: consul.json
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        volumeMounts:
        - name: data
          mountPath: /consul/data
        livenessProbe:
          httpGet:
            path: /v1/status/leader
            port: 8500
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /v1/status/leader
            port: 8500
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: standard
      resources:
        requests:
          storage: 10Gi

---
apiVersion: v1
kind: Service
metadata:
  name: consul-headless
  labels:
    app: consul
    component: service-registry
spec:
  clusterIP: None
  ports:
  - port: 8500
    name: http
  - port: 8502
    name: grpc
  - port: 8301
    name: serflan-tcp
  - port: 8301
    protocol: UDP
    name: serflan-udp
  - port: 8302
    name: serfwan-tcp
  - port: 8302
    protocol: UDP
    name: serfwan-udp
  - port: 8300
    name: server
  - port: 8600
    name: dns-tcp
  - port: 8600
    protocol: UDP
    name: dns-udp
  selector:
    app: consul

---
apiVersion: v1
kind: Service
metadata:
  name: consul
  labels:
    app: consul
    component: service-registry
spec:
  ports:
  - port: 8500
    name: http
  - port: 8502
    name: grpc
  selector:
    app: consul