#cloud-config

# Traccar Cloud-Init Configuration
# Supports both monolithic and microservices deployment

# Configuration variables
write_files:
  # Common database configuration
  - content: |
      <?xml version="1.0" encoding="UTF-8"?>
      <!DOCTYPE properties SYSTEM 'http://java.sun.com/dtd/properties.dtd'>
      <properties>
        <entry key='database.driver'>com.mysql.jdbc.Driver</entry>
        <entry key='database.url'>jdbc:mysql://localhost/traccar?zeroDateTimeBehavior=round&amp;serverTimezone=UTC&amp;allowPublicKeyRetrieval=true&amp;useSSL=false&amp;allowMultiQueries=true&amp;autoReconnect=true&amp;useUnicode=yes&amp;characterEncoding=UTF-8&amp;sessionVariables=sql_mode=''</entry>
        <entry key='database.user'>root</entry>
        <entry key='database.password'>root</entry>
      </properties>
    path: /root/traccar.xml
    permissions: '0644'

  # Microservices configuration - Message Broker (Kafka)
  - content: |
      # Kafka configuration
      broker.id=1
      listeners=PLAINTEXT://:9092
      advertised.listeners=PLAINTEXT://localhost:9092
      num.network.threads=3
      num.io.threads=8
      socket.send.buffer.bytes=102400
      socket.receive.buffer.bytes=102400
      socket.request.max.bytes=104857600
      log.dirs=/var/lib/kafka/data
      num.partitions=3
      num.recovery.threads.per.data.dir=1
      offsets.topic.replication.factor=1
      transaction.state.log.replication.factor=1
      transaction.state.log.min.isr=1
      log.retention.hours=168
      log.segment.bytes=1073741824
      log.retention.check.interval.ms=300000
      zookeeper.connect=localhost:2181
      zookeeper.connection.timeout.ms=18000
      group.initial.rebalance.delay.ms=0
      auto.create.topics.enable=true
    path: /etc/kafka/server.properties
    permissions: '0644'

  # Microservices configuration - Service Discovery (Consul)
  - content: |
      {
        "datacenter": "dc1",
        "data_dir": "/var/lib/consul",
        "log_level": "INFO",
        "node_name": "traccar-node",
        "server": true,
        "bootstrap_expect": 1,
        "ui_config": {
          "enabled": true
        },
        "client_addr": "0.0.0.0",
        "bind_addr": "0.0.0.0",
        "ports": {
          "http": 8500,
          "dns": 8600,
          "serf_lan": 8301,
          "serf_wan": 8302,
          "server": 8300
        },
        "service": {
          "name": "consul"
        }
      }
    path: /etc/consul/consul.json
    permissions: '0644'

  # Docker Compose for local development
  - content: |
      version: '3.8'
      
      services:
        # Database
        mysql:
          image: mysql:8.0
          environment:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: traccar
          ports:
            - "3306:3306"
          volumes:
            - mysql-data:/var/lib/mysql
          restart: unless-stopped
          healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
            interval: 10s
            timeout: 5s
            retries: 5
      
        # Message Broker - Kafka
        zookeeper:
          image: confluentinc/cp-zookeeper:7.3.0
          environment:
            ZOOKEEPER_CLIENT_PORT: 2181
            ZOOKEEPER_TICK_TIME: 2000
          ports:
            - "2181:2181"
          volumes:
            - zookeeper-data:/var/lib/zookeeper/data
            - zookeeper-log:/var/lib/zookeeper/log
          restart: unless-stopped
      
        kafka:
          image: confluentinc/cp-kafka:7.3.0
          depends_on:
            - zookeeper
          ports:
            - "9092:9092"
          environment:
            KAFKA_BROKER_ID: 1
            KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
            KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
            KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
            KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
            KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
            KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
          volumes:
            - kafka-data:/var/lib/kafka/data
          restart: unless-stopped
      
        # Service Discovery - Consul
        consul:
          image: hashicorp/consul:1.14
          ports:
            - "8500:8500"
            - "8600:8600/tcp"
            - "8600:8600/udp"
          volumes:
            - consul-data:/consul/data
          command: "agent -server -bootstrap-expect=1 -ui -client=0.0.0.0"
          restart: unless-stopped
      
        # API Gateway
        api-gateway:
          image: traccar/api-gateway:latest
          ports:
            - "8080:8080"
          environment:
            - SPRING_PROFILES_ACTIVE=docker
            - CONSUL_HOST=consul
            - DATABASE_URL=jdbc:mysql://mysql:3306/traccar
            - DATABASE_USER=root
            - DATABASE_PASSWORD=root
          depends_on:
            - mysql
            - consul
          restart: unless-stopped
      
        # Protocol Service
        protocol-service:
          image: traccar/protocol:latest
          ports:
            - "5000-5090:5000-5090"
          environment:
            - SPRING_PROFILES_ACTIVE=docker
            - CONSUL_HOST=consul
            - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
            - DATABASE_URL=jdbc:mysql://mysql:3306/traccar
            - DATABASE_USER=root
            - DATABASE_PASSWORD=root
          depends_on:
            - mysql
            - kafka
            - consul
          restart: unless-stopped
      
        # Position Service
        position-service:
          image: traccar/position:latest
          environment:
            - SPRING_PROFILES_ACTIVE=docker
            - CONSUL_HOST=consul
            - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
            - DATABASE_URL=jdbc:mysql://mysql:3306/traccar
            - DATABASE_USER=root
            - DATABASE_PASSWORD=root
          depends_on:
            - mysql
            - kafka
            - consul
          restart: unless-stopped
      
        # Event Service
        event-service:
          image: traccar/event:latest
          environment:
            - SPRING_PROFILES_ACTIVE=docker
            - CONSUL_HOST=consul
            - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
            - DATABASE_URL=jdbc:mysql://mysql:3306/traccar
            - DATABASE_USER=root
            - DATABASE_PASSWORD=root
          depends_on:
            - mysql
            - kafka
            - consul
          restart: unless-stopped
      
        # Notification Service
        notification-service:
          image: traccar/notification:latest
          environment:
            - SPRING_PROFILES_ACTIVE=docker
            - CONSUL_HOST=consul
            - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
            - DATABASE_URL=jdbc:mysql://mysql:3306/traccar
            - DATABASE_USER=root
            - DATABASE_PASSWORD=root
          depends_on:
            - mysql
            - kafka
            - consul
          restart: unless-stopped
      
        # Reporting Service
        reporting-service:
          image: traccar/reporting:latest
          environment:
            - SPRING_PROFILES_ACTIVE=docker
            - CONSUL_HOST=consul
            - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
            - DATABASE_URL=jdbc:mysql://mysql:3306/traccar
            - DATABASE_USER=root
            - DATABASE_PASSWORD=root
          depends_on:
            - mysql
            - kafka
            - consul
          restart: unless-stopped
      
      volumes:
        mysql-data:
        zookeeper-data:
        zookeeper-log:
        kafka-data:
        consul-data:
    path: /root/docker-compose.yml
    permissions: '0644'

  # Kubernetes deployment script
  - content: |
      #!/bin/bash
      
      # Install Traccar microservices using Helm
      echo "Installing Traccar microservices..."
      
      # Add Traccar Helm repository
      helm repo add traccar https://traccar.github.io/helm-charts
      helm repo update
      
      # Create namespace
      kubectl create namespace traccar
      
      # Install Traccar microservices
      helm install traccar traccar/traccar \
        --namespace traccar \
        --set global.database.host=${DB_HOST:-mysql} \
        --set global.database.port=${DB_PORT:-3306} \
        --set global.database.name=${DB_NAME:-traccar} \
        --set global.database.user=${DB_USER:-root} \
        --set global.database.password=${DB_PASSWORD:-root} \
        --set global.kafka.bootstrapServers=${KAFKA_SERVERS:-kafka:9092} \
        --set global.serviceDiscovery.type=${DISCOVERY_TYPE:-consul} \
        --set global.serviceDiscovery.host=${DISCOVERY_HOST:-consul} \
        --set global.serviceDiscovery.port=${DISCOVERY_PORT:-8500}
      
      echo "Traccar microservices installation complete!"
    path: /root/install-traccar-k8s.sh
    permissions: '0755'

package_update: true
packages:
  - unzip
  - curl
  - apt-transport-https
  - ca-certificates
  - gnupg
  - lsb-release
  - software-properties-common
  - mysql-server

runcmd:
  # Setup deployment mode - set to "monolithic" or "microservices"
  - export DEPLOYMENT_MODE="${DEPLOYMENT_MODE:-microservices}"
  - export MESSAGE_BROKER="${MESSAGE_BROKER:-kafka}"
  - export SERVICE_DISCOVERY="${SERVICE_DISCOVERY:-consul}"
  - export CONTAINER_RUNTIME="${CONTAINER_RUNTIME:-docker}"
  - export ORCHESTRATION="${ORCHESTRATION:-kubernetes}"
  
  # Database setup
  - mysql -u root --execute="ALTER USER 'root'@'localhost' IDENTIFIED WITH mysql_native_password BY 'root'; GRANT ALL ON *.* TO 'root'@'localhost' WITH GRANT OPTION; FLUSH PRIVILEGES; CREATE DATABASE traccar;"
  
  # Install Docker
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /usr/share/keyrings/docker-archive-keyring.gpg
  - echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/docker-archive-keyring.gpg] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" | tee /etc/apt/sources.list.d/docker.list > /dev/null
  - apt-get update
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-compose-plugin
  - systemctl enable docker
  - systemctl start docker
  
  # Install Kubernetes tools if orchestration is kubernetes
  - if [ "$ORCHESTRATION" = "kubernetes" ]; then curl -fsSL https://packages.cloud.google.com/apt/doc/apt-key.gpg | gpg --dearmor -o /usr/share/keyrings/kubernetes-archive-keyring.gpg; fi
  - if [ "$ORCHESTRATION" = "kubernetes" ]; then echo "deb [signed-by=/usr/share/keyrings/kubernetes-archive-keyring.gpg] https://apt.kubernetes.io/ kubernetes-xenial main" | tee /etc/apt/sources.list.d/kubernetes.list; fi
  - if [ "$ORCHESTRATION" = "kubernetes" ]; then apt-get update && apt-get install -y kubectl; fi
  
  # Install Helm if orchestration is kubernetes
  - if [ "$ORCHESTRATION" = "kubernetes" ]; then curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash; fi
  
  # Install and configure message broker if deployment mode is microservices
  - if [ "$DEPLOYMENT_MODE" = "microservices" ] && [ "$MESSAGE_BROKER" = "kafka" ]; then
      curl -fsSL https://packages.confluent.io/deb/7.3/archive.key | gpg --dearmor -o /usr/share/keyrings/confluent-archive-keyring.gpg;
      echo "deb [signed-by=/usr/share/keyrings/confluent-archive-keyring.gpg] https://packages.confluent.io/deb/7.3 stable main" | tee /etc/apt/sources.list.d/confluent.list;
      apt-get update && apt-get install -y confluent-community-2.13;
      mkdir -p /var/lib/kafka/data;
      systemctl enable confluent-zookeeper confluent-kafka;
      systemctl start confluent-zookeeper confluent-kafka;
    fi
  
  # Install and configure service discovery if deployment mode is microservices
  - if [ "$DEPLOYMENT_MODE" = "microservices" ] && [ "$SERVICE_DISCOVERY" = "consul" ]; then
      curl -fsSL https://apt.releases.hashicorp.com/gpg | gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg;
      echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | tee /etc/apt/sources.list.d/hashicorp.list;
      apt-get update && apt-get install -y consul;
      mkdir -p /etc/consul /var/lib/consul;
      systemctl enable consul;
      systemctl start consul;
    fi
  
  # Deploy Traccar based on deployment mode
  - if [ "$DEPLOYMENT_MODE" = "monolithic" ]; then
      wget https://www.traccar.org/download/traccar-linux-64-latest.zip;
      unzip traccar-linux-*.zip && ./traccar.run;
      cp /root/traccar.xml /opt/traccar/conf/;
      service traccar start;
    elif [ "$DEPLOYMENT_MODE" = "microservices" ] && [ "$ORCHESTRATION" = "kubernetes" ]; then
      bash /root/install-traccar-k8s.sh;
    elif [ "$DEPLOYMENT_MODE" = "microservices" ]; then
      mkdir -p /opt/traccar;
      cd /root;
      docker compose -f docker-compose.yml up -d;
    fi