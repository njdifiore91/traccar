apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: protocol-service-hpa
  labels:
    app: protocol-service
    component: protocol
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: protocol-service
  minReplicas: 2
  maxReplicas: 10
  metrics:
  # CPU utilization target
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  # Memory utilization target
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  # Custom metric for active connections
  - type: Pods
    pods:
      metric:
        name: active_connections
      target:
        type: AverageValue
        averageValue: 1000
  # Scaling behavior configuration
  behavior:
    # Scale up behavior - respond quickly to increased load
    scaleUp:
      stabilizationWindowSeconds: 60  # Wait 60s before scaling up again
      policies:
      - type: Percent
        value: 100                    # Allow doubling of pods
        periodSeconds: 60             # Within a 60s period
    # Scale down behavior - scale down more conservatively
    scaleDown:
      stabilizationWindowSeconds: 300  # Wait 5 minutes before scaling down
      policies:
      - type: Percent
        value: 10                      # Only reduce by 10% at a time
        periodSeconds: 120             # Within a 2-minute period