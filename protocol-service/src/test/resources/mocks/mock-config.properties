# ======================================================================
# Protocol Service Mock Configuration
# ======================================================================
# This file contains configuration for all mock services used in Protocol Service tests.
# It defines global settings, default behaviors, and common parameters used across
# different mock implementations.
#
# This configuration ensures that Protocol Service tests use isolated configurations
# that don't affect production systems and provides consistent test environments.
#
# Key features:
# - Configurable timeout and retry settings for all mock services
# - Default response behaviors for simulated external services
# - Environment-specific override capabilities (dev, test, chaos, perf)
# - Mock service discovery configuration for service-to-service communication

# ======================================================================
# Global Mock Settings
# ======================================================================

# Global timeout settings (in milliseconds)
mock.global.timeout.connect=500
mock.global.timeout.read=1000
mock.global.timeout.write=1000
mock.global.timeout.shutdown=2000

# Global retry settings
mock.global.retry.max-attempts=3
mock.global.retry.initial-delay=100
mock.global.retry.multiplier=2.0
mock.global.retry.max-delay=1000
mock.global.retry.jitter=0.1

# Default response delay (simulates network latency in ms)
mock.global.response.delay=50
mock.global.response.variance=10

# Default error rate (percentage of requests that will fail)
mock.global.error.rate=0

# Circuit breaker settings
mock.global.circuit-breaker.failure-threshold=50
mock.global.circuit-breaker.reset-timeout=30000

# ======================================================================
# Service Discovery Mock
# ======================================================================

# Mock Consul service discovery
mock.service-discovery.enabled=true
mock.service-discovery.type=consul
mock.service-discovery.host=localhost
mock.service-discovery.port=8500

# Simulated services for discovery
mock.service-discovery.services.position-service.host=localhost
mock.service-discovery.services.position-service.port=8081
mock.service-discovery.services.position-service.status=UP
mock.service-discovery.services.event-service.host=localhost
mock.service-discovery.services.event-service.port=8082
mock.service-discovery.services.event-service.status=UP
mock.service-discovery.services.notification-service.host=localhost
mock.service-discovery.services.notification-service.port=8083
mock.service-discovery.services.notification-service.status=UP
mock.service-discovery.services.api-gateway.host=localhost
mock.service-discovery.services.api-gateway.port=8084
mock.service-discovery.services.api-gateway.status=UP

# ======================================================================
# Message Broker Mock
# ======================================================================

# Mock Kafka message broker
mock.message-broker.enabled=true
mock.message-broker.type=kafka
mock.message-broker.host=localhost
mock.message-broker.port=9092

# Topic configuration
mock.message-broker.topics.raw-positions.partitions=3
mock.message-broker.topics.raw-positions.retention-ms=86400000
mock.message-broker.topics.commands.partitions=1
mock.message-broker.topics.commands.retention-ms=86400000
mock.message-broker.topics.device-status.partitions=1
mock.message-broker.topics.device-status.retention-ms=86400000

# Message validation
mock.message-broker.validation.enabled=true
mock.message-broker.validation.schema-registry.url=http://localhost:8081

# Message delivery simulation
mock.message-broker.delivery.success-rate=100
mock.message-broker.delivery.latency-ms=5

# ======================================================================
# Geocoding Service Mock
# ======================================================================

mock.geocoding.enabled=true
mock.geocoding.default-provider=google
mock.geocoding.url=http://localhost:8090/geocode
mock.geocoding.timeout=1000

# Default responses for specific coordinates
mock.geocoding.response.default={"address":"Unknown Location","country":"Unknown","formatted":"Unknown Location"}
mock.geocoding.response.0.0={"address":"Atlantic Ocean","country":"International Waters","formatted":"Atlantic Ocean, International Waters"}
mock.geocoding.response.40.7128=-73.9872={"address":"New York City","country":"United States","formatted":"New York City, NY, United States"}
mock.geocoding.response.51.5074=-0.1278={"address":"London","country":"United Kingdom","formatted":"London, United Kingdom"}
mock.geocoding.response.48.8566=2.3522={"address":"Paris","country":"France","formatted":"Paris, France"}
mock.geocoding.response.35.6762=139.6503={"address":"Tokyo","country":"Japan","formatted":"Tokyo, Japan"}

# ======================================================================
# Authentication Service Mock
# ======================================================================

mock.authentication.enabled=true
mock.authentication.url=http://localhost:8091/auth
mock.authentication.timeout=500

# Default device authentication responses
mock.authentication.devices.valid=123456789,987654321,555555555,111222333,444555666
mock.authentication.devices.invalid=000000000,111111111,999999999
mock.authentication.response.valid={"status":"success","authenticated":true,"deviceId":"{deviceId}"}
mock.authentication.response.invalid={"status":"error","authenticated":false,"message":"Invalid credentials"}

# Token generation for authenticated devices
mock.authentication.token.enabled=true
mock.authentication.token.expiration=3600
mock.authentication.token.secret=mock-secret-key-for-testing-only

# ======================================================================
# Database Mock
# ======================================================================

mock.database.enabled=true
mock.database.type=h2
mock.database.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
mock.database.username=sa
mock.database.password=
mock.database.pool.size=10
mock.database.pool.idle-timeout=30000

# Predefined test data
mock.database.data.devices=true
mock.database.data.commands=true
mock.database.data.users=true
mock.database.data.geofences=true

# Test device data
mock.database.devices.count=10
mock.database.devices.prefix=test-device-

# Test command data
mock.database.commands.types=engineStop,engineResume,positionSingle,positionPeriodic,positionStop,alarmArm,alarmDisarm,setTimezone,requestPhoto,powerOff,rebootDevice

# ======================================================================
# Observability Mocks
# ======================================================================

# Tracing mock (Jaeger/Zipkin)
mock.tracing.enabled=true
mock.tracing.type=jaeger
mock.tracing.host=localhost
mock.tracing.port=14250
mock.tracing.sampling-rate=1.0
mock.tracing.service-name=protocol-service
mock.tracing.propagation=b3

# Metrics mock (Prometheus)
mock.metrics.enabled=true
mock.metrics.host=localhost
mock.metrics.port=9090
mock.metrics.scrape-interval=15
mock.metrics.path=/metrics

# Logging mock (ELK)
mock.logging.enabled=true
mock.logging.host=localhost
mock.logging.port=5044
mock.logging.index=protocol-service-logs
mock.logging.level=INFO

# ======================================================================
# Environment-specific Overrides
# ======================================================================

# Development environment - Fast responses, no errors
mock.env.dev.global.error.rate=0
mock.env.dev.global.response.delay=0
mock.env.dev.message-broker.delivery.success-rate=100
mock.env.dev.tracing.sampling-rate=0.1

# Testing environment - Realistic conditions
mock.env.test.global.error.rate=5
mock.env.test.global.response.delay=50
mock.env.test.message-broker.delivery.success-rate=99
mock.env.test.message-broker.delivery.latency-ms=10
mock.env.test.tracing.sampling-rate=1.0

# Chaos testing environment - Adverse conditions
mock.env.chaos.global.error.rate=25
mock.env.chaos.global.response.delay=100
mock.env.chaos.global.timeout.connect=250
mock.env.chaos.global.timeout.read=500
mock.env.chaos.message-broker.delivery.success-rate=85
mock.env.chaos.message-broker.delivery.latency-ms=50
mock.env.chaos.service-discovery.flaky=true

# Performance testing environment - High throughput
mock.env.perf.global.error.rate=0
mock.env.perf.global.response.delay=1
mock.env.perf.message-broker.delivery.success-rate=100
mock.env.perf.message-broker.delivery.latency-ms=1
mock.env.perf.tracing.sampling-rate=0.01