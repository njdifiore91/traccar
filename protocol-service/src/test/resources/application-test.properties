# ----------------------------------------
# Protocol Service Test Configuration
# ----------------------------------------

# Application Configuration
spring.application.name=protocol-service-test
spring.main.banner-mode=off
spring.main.allow-bean-definition-overriding=true

# Server Configuration
server.port=8081
server.address=0.0.0.0
server.compression.enabled=true

# Protocol Service Configuration
protocol.service.enabled=true
protocol.service.standalone=true
protocol.service.test-mode=true
protocol.service.decoder.timeout=5000
protocol.service.connection.timeout=10000
protocol.service.worker-threads=10
protocol.service.boss-threads=2

# Protocol-specific test ports (using non-standard ports to avoid conflicts)
protocol.port.tk103=15001
protocol.port.teltonika=15002
protocol.port.meitrack=15003
protocol.port.atrack=15004
protocol.port.totem=15005
protocol.port.osmand=15006
protocol.port.h02=15007
protocol.port.gt06=15008
protocol.port.meiligao=15009
protocol.port.suntech=15010

# Message Broker Configuration - Kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=protocol-service-test
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.ByteArrayDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.ByteArraySerializer
spring.kafka.producer.acks=1
spring.kafka.listener.missing-topics-fatal=false

# Message Broker Configuration - RabbitMQ (alternative)
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.virtual-host=/
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.initial-interval=1000
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.multiplier=1.5

# Service Discovery - Consul
spring.cloud.consul.enabled=true
spring.cloud.consul.host=localhost
spring.cloud.consul.port=8500
spring.cloud.consul.discovery.enabled=true
spring.cloud.consul.discovery.instance-id=${spring.application.name}:${random.value}
spring.cloud.consul.discovery.prefer-ip-address=true
spring.cloud.consul.discovery.health-check-interval=15s
spring.cloud.consul.discovery.health-check-path=/actuator/health
spring.cloud.consul.discovery.health-check-timeout=5s
spring.cloud.consul.discovery.tags=test

# Service Discovery - Kubernetes (alternative)
spring.cloud.kubernetes.enabled=false
spring.cloud.kubernetes.discovery.enabled=false
spring.cloud.kubernetes.config.enabled=false
spring.cloud.kubernetes.reload.enabled=false

# Resilience4j Circuit Breaker Configuration
resilience4j.circuitbreaker.configs.default.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.configs.default.sliding-window-size=10
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=5s
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.configs.default.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.configs.default.record-exceptions=java.io.IOException,java.net.ConnectException

# Resilience4j Retry Configuration
resilience4j.retry.configs.default.max-attempts=3
resilience4j.retry.configs.default.wait-duration=1s
resilience4j.retry.configs.default.retry-exceptions=java.io.IOException,java.net.ConnectException

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true
management.health.diskspace.enabled=true
management.metrics.export.prometheus.enabled=true

# Logging Configuration
logging.level.root=WARN
logging.level.org.traccar=DEBUG
logging.level.org.traccar.protocol=DEBUG
logging.level.org.springframework=WARN
logging.level.org.apache.kafka=WARN
logging.level.org.springframework.cloud=WARN

# OpenTelemetry Configuration
otel.traces.exporter=otlp
otel.metrics.exporter=otlp
otel.exporter.otlp.endpoint=http://localhost:4317
otel.service.name=${spring.application.name}
otel.instrumentation.annotations.enabled=true

# Test-specific Database Configuration (H2 in-memory)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Test-specific Cache Configuration
spring.cache.type=simple

# Test-specific Security Configuration
spring.security.user.name=test
spring.security.user.password=test

# Protocol-specific Test Configuration
protocol.test.simulate-network-issues=false
protocol.test.simulate-device-disconnect=false
protocol.test.message-delay-ms=0
protocol.test.position-frequency-ms=1000

# Test Message Topics
protocol.topics.position=test-positions
protocol.topics.device=test-devices
protocol.topics.command=test-commands
protocol.topics.event=test-events

# Test Timeouts
protocol.test.connection-timeout-ms=5000
protocol.test.response-timeout-ms=2000
protocol.test.command-timeout-ms=3000

# Test Feature Flags
protocol.features.binary-protocol-logging=true
protocol.features.extended-debugging=true
protocol.features.message-validation=true
protocol.features.position-forwarding=false