# Testcontainers configuration for Protocol Service
# This file configures the behavior of Testcontainers for integration testing in the Protocol Service

#-------------------------------------------------------
# CONTAINER REUSE SETTINGS
#-------------------------------------------------------
# Enable container reuse to improve test performance
# This prevents containers from being destroyed after each test run, significantly
# reducing test execution time in development environments
testcontainers.reuse.enable=true

#-------------------------------------------------------
# RESOURCE LIMITS
#-------------------------------------------------------
# Configure resource limits for test containers to prevent excessive resource consumption
# and ensure consistent test behavior across different environments
# Memory limit per container (in megabytes)
docker.container.memory=512m
# CPU limit per container (number of cores)
docker.container.cpu-count=1

#-------------------------------------------------------
# IMAGE PULL POLICY
#-------------------------------------------------------
# Configure how and when container images are pulled
# 'always-if-not-present' only pulls images if they don't exist locally,
# optimizing startup time while ensuring images are up-to-date
pull.policy=always-if-not-present
# Maximum time to wait for image pulls (in seconds)
pull.timeout=120
# Maximum time to wait during pull pauses (in seconds)
pull.pause.timeout=30

#-------------------------------------------------------
# RYUK CONTAINER SETTINGS
#-------------------------------------------------------
# Ryuk is responsible for container cleanup
# Can be disabled in CI environments by setting TESTCONTAINERS_RYUK_DISABLED=true
# This is useful in environments that already handle container cleanup
ryuk.container.disabled=${TESTCONTAINERS_RYUK_DISABLED:false}

#-------------------------------------------------------
# STARTUP CHECKS
#-------------------------------------------------------
# Disable Docker environment checks to speed up test execution
# These checks verify Docker is properly configured before running tests
# Disabling them can improve test startup time in known-good environments
checks.disable=${TESTCONTAINERS_CHECKS_DISABLE:true}

#-------------------------------------------------------
# DATABASE CONTAINER SETTINGS
#-------------------------------------------------------
# Configure timeout for database container startup (in seconds)
# Increase this value if database initialization takes longer in your environment
database.container.startup.timeout=120

#-------------------------------------------------------
# NETWORK CONFIGURATION
#-------------------------------------------------------
# Strategy for connecting to Docker
# DefaultDockerClientProviderStrategy attempts to find a Docker environment
# using multiple methods in a specific order
docker.client.strategy=org.testcontainers.dockerclient.DefaultDockerClientProviderStrategy

#-------------------------------------------------------
# PROTOCOL SERVICE SPECIFIC SETTINGS
#-------------------------------------------------------
# Configure timeouts for protocol-specific test containers
# These settings help manage resources during protocol decoder/encoder testing

# Wait strategy timeout for protocol service containers (in seconds)
protocol.container.wait.timeout=60

# Configure parallel execution for protocol tests
# This allows multiple protocol tests to run concurrently
protocol.container.parallel.enabled=true

# Configure container startup order for multi-container tests
# This ensures dependencies are started before dependent services
protocol.container.startup.order.enabled=true

#-------------------------------------------------------
# MESSAGE BROKER SETTINGS
#-------------------------------------------------------
# Configure message broker containers used in integration tests

# Kafka container settings
kafka.container.startup.timeout=120
kafka.container.confluentinc.version=7.3.0

# RabbitMQ container settings
rabbitmq.container.startup.timeout=120
rabbitmq.container.version=3.11-management