# Test configuration for device protocols supported by the Protocol Service
# This file defines settings for each protocol including port numbers, timeouts, and other protocol-specific parameters
# Used for testing protocol-specific functionality without affecting production configurations

# General settings applied to all protocols unless overridden
general:
  timeout: 60  # Default connection timeout in seconds
  resetDelay: 0  # Default delay before resetting connection
  loggerEnabled: true  # Enable protocol message logging for debugging
  testMode: true  # Enable test mode for all protocols
  mockResponses: true  # Enable mock responses for testing

