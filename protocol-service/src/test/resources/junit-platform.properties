# JUnit Platform Configuration for Protocol Service

# Enable parallel test execution for improved build performance
junit.jupiter.execution.parallel.enabled=true
junit.jupiter.execution.parallel.mode.default=concurrent
junit.jupiter.execution.parallel.mode.classes.default=concurrent

# Configure dynamic parallel execution strategy based on available processors
junit.jupiter.execution.parallel.config.strategy=dynamic
junit.jupiter.execution.parallel.config.dynamic.factor=0.5

# Set test instance lifecycle to per_class for efficient resource usage
junit.jupiter.testinstance.lifecycle.default=per_class

# Define test execution order for deterministic test runs
junit.jupiter.execution.order.default=org.junit.jupiter.api.ClassOrderer$OrderAnnotation
junit.jupiter.execution.order.random.seed=42

# Configure display name generator for readable test reports
junit.jupiter.displayname.generator.default=org.junit.jupiter.api.DisplayNameGenerator$ReplaceUnderscores

# Enable protocol-specific test tags
junit.jupiter.execution.filter.tag.include=protocol,integration

# Disable test discovery timeout to handle large test suites
junit.jupiter.discovery.timeout=0

# Configure test execution timeout to prevent hanging tests
junit.jupiter.execution.timeout.default=60s
junit.jupiter.execution.timeout.testable.method.default=30s
junit.jupiter.execution.timeout.test.method.default=30s

# Enable test execution listeners for detailed reporting
junit.jupiter.extensions.autodetection.enabled=true