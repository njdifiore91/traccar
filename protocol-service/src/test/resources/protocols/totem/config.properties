# Totem Protocol Test Configuration

# Protocol version detection settings
totem.protocol.detectVersion=true
totem.protocol.defaultVersion=1

# Acknowledgment handling settings
totem.ack.enable=true
totem.ack.format.v1=ACK OK\r\n
totem.ack.format.v4=$$0014AA%s%02X

# Response timeout settings (in milliseconds)
totem.response.timeout=5000

# Frame decoder settings
totem.frame.prefix=$$
totem.frame.lengthField=true
totem.frame.lengthFieldOffset=2
totem.frame.lengthFieldLength=2
totem.frame.lengthFieldBase=16

# Protocol-specific settings
totem.position.reportInterval=60
totem.position.speedThreshold=5
totem.position.angleThreshold=15

# Alarm code mappings for protocol versions 1, 2, 3
totem.alarm.sos=0x01
totem.alarm.lowBattery=0x10
totem.alarm.overspeed=0x11
totem.alarm.parking=0x30
totem.alarm.geofenceExit=0x42
totem.alarm.geofenceEnter=0x43

# Alarm code mappings for protocol version 4
totem.alarm.v4.sos=0x01
totem.alarm.v4.overspeed=0x02
totem.alarm.v4.geofenceExit=0x04
totem.alarm.v4.geofenceEnter=0x05
totem.alarm.v4.tow=0x06
totem.alarm.v4.gpsAntennaCut=0x07
totem.alarm.v4.powerCut=0x10
totem.alarm.v4.powerRestored=0x11
totem.alarm.v4.lowPower=0x12
totem.alarm.v4.lowBattery=0x13
totem.alarm.v4.vibration=0x40
totem.alarm.v4.idle=0x41
totem.alarm.v4.acceleration=0x42
totem.alarm.v4.braking=0x43

# Command settings
totem.command.defaultPassword=000000
totem.command.reboot=006
totem.command.factoryReset=007
totem.command.getVersion=056
totem.command.positionSingle=012
totem.command.engineStop=025,C,1
totem.command.engineResume=025,C,0

# SMS command format
totem.sms.prefix=*
totem.sms.suffix=#

# Test-specific settings
totem.test.simulateAcknowledgment=true
totem.test.validateChecksum=true
totem.test.validateMessageFormat=true