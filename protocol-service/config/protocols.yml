# Protocol Service Configuration
# This file defines settings for all supported device protocols in the Protocol Service

# Global protocol settings
global:
  # Network interface to bind to (leave empty to bind to all interfaces)
  interface: ""
  # Default connection timeout in seconds
  timeout: 60
  # Enable buffering of incoming data (in milliseconds, 0 to disable)
  buffer: 0
  # Send device responses immediately before database write
  immediateResponse: true

