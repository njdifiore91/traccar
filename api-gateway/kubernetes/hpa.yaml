# API Gateway Service - Horizontal Pod Autoscaler Configuration
# This manifest defines the HorizontalPodAutoscaler for the API Gateway Service,
# which automatically adjusts the number of replicas based on resource utilization
# and custom metrics.

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-gateway-hpa
  namespace: api-gateway
  labels:
    app: api-gateway
    component: api
  annotations:
    description: "Automatically scales API Gateway Service based on CPU, memory, and request rate metrics"
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-gateway
  # Minimum 2 replicas for high availability, maximum 10 replicas for cost control
  minReplicas: 2
  maxReplicas: 10
  # Metrics that trigger scaling decisions
  metrics:
  # CPU-based scaling - target 70% utilization
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  # Memory-based scaling - target 80% utilization
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  # Request rate-based scaling - target 500 requests per second per pod
  - type: Pods
    pods:
      metric:
        name: http_requests_per_second
      target:
        type: AverageValue
        averageValue: 500
  # Scaling behavior configuration to prevent oscillation and provide appropriate scaling characteristics
  behavior:
    # Scale down configuration - more conservative to prevent rapid fluctuations
    scaleDown:
      # 5-minute stabilization window prevents premature scale-down during temporary traffic drops
      stabilizationWindowSeconds: 300
      policies:
      # Scale down by at most 50% of current replicas per minute
      - type: Percent
        value: 50
        periodSeconds: 60
      # Or remove at most 2 pods per minute, whichever is less aggressive
      - type: Pods
        value: 2
        periodSeconds: 60
      # Use the less aggressive policy (Min) to ensure gradual scale-down
      selectPolicy: Min
    # Scale up configuration - more aggressive to handle traffic spikes quickly
    scaleUp:
      # 1-minute stabilization window allows quick response to increased load
      stabilizationWindowSeconds: 60
      policies:
      # Scale up by at most 100% of current replicas per 30 seconds
      - type: Percent
        value: 100
        periodSeconds: 30
      # Or add at most 4 pods per minute, whichever is more aggressive
      - type: Pods
        value: 4
        periodSeconds: 60
      # Use the more aggressive policy (Max) to ensure rapid scale-up during traffic spikes
      selectPolicy: Max