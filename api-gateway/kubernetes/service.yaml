apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: traccar
  labels:
    app: api-gateway
    component: api-gateway
    part-of: traccar
  annotations:
    # Cloud provider-specific load balancer annotations
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"  # Network Load Balancer for AWS
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
    service.beta.kubernetes.io/azure-load-balancer-internal: "false"  # External load balancer for Azure
    cloud.google.com/neg: '{"ingress": true}'  # Network Endpoint Group for GCP
    # Add additional cloud provider-specific annotations as needed
    
    # Monitoring annotations
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: "/actuator/prometheus"
    
    # Documentation
    traccar.com/description: "API Gateway Service for external client access"
spec:
  type: LoadBalancer  # Expose service externally with a cloud provider load balancer
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
    - name: websocket
      port: 8081
      targetPort: 8081
      protocol: TCP
  selector:
    app: api-gateway  # Match pods with this label
  sessionAffinity: ClientIP  # Ensure WebSocket connections maintain affinity to the same pod
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800  # 3-hour session affinity timeout
  # Optional: Specify external traffic policy for better session affinity
  externalTrafficPolicy: Local  # Preserves client source IP and avoids extra hop