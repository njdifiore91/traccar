# Database Configuration for Event Processing Service

spring:
  # Datasource Configuration
  datasource:
    # JDBC URL with environment variable substitution
    url: ${EVENT_DB_URL:jdbc:h2:./data/event-database}
    # Database credentials with environment variable substitution
    username: ${EVENT_DB_USER:sa}
    password: ${EVENT_DB_PASSWORD:}
    # Driver class name with auto-detection based on URL if not specified
    driver-class-name: ${EVENT_DB_DRIVER:}
    # HikariCP Connection Pool Configuration
    hikari:
      # Maximum pool size optimized for event processing workloads
      maximum-pool-size: ${EVENT_DB_MAX_POOL_SIZE:10}
      # Minimum idle connections to maintain
      minimum-idle: ${EVENT_DB_MIN_IDLE:2}
      # Connection idle timeout
      idle-timeout: ${EVENT_DB_IDLE_TIMEOUT:30000}
      # Maximum lifetime of a connection in the pool
      max-lifetime: ${EVENT_DB_MAX_LIFETIME:1800000}
      # Connection timeout
      connection-timeout: ${EVENT_DB_CONNECTION_TIMEOUT:30000}
      # Pool name for monitoring and JMX
      pool-name: EventServiceHikariCP
      # Test query to validate connections
      connection-test-query: ${EVENT_DB_TEST_QUERY:SELECT 1}
      # Register MBeans for monitoring
      register-mbeans: true

  # Liquibase Migration Configuration
  liquibase:
    # Enable Liquibase migrations
    enabled: ${EVENT_DB_LIQUIBASE_ENABLED:true}
    # Path to the master changelog file
    change-log: classpath:db/changelog/changelog-master.xml
    # Database schema to use
    default-schema: ${EVENT_DB_SCHEMA:public}
    # Liquibase contexts to use
    contexts: ${EVENT_DB_LIQUIBASE_CONTEXTS:}
    # Whether to check if changelog exists before running
    check-change-log-location: true
    # Parameters to pass to Liquibase
    parameters:
      # Table prefix for all Traccar tables
      tablePrefix: tc_

# Health Check Configuration
management:
  health:
    db:
      enabled: true
    # Database health check configuration
    database:
      enabled: true
    # Diskspace health check configuration
    diskspace:
      enabled: true
      # Threshold for disk space warning
      threshold: ${EVENT_DB_DISKSPACE_THRESHOLD:10MB}

# Additional Database Configuration Properties
db:
  # Event data retention period in days (0 = no automatic cleanup)
  event-retention-days: ${EVENT_DB_EVENT_RETENTION_DAYS:0}
  # Geofence data retention period in days (0 = no automatic cleanup)
  geofence-retention-days: ${EVENT_DB_GEOFENCE_RETENTION_DAYS:0}
  # Database statistics logging interval in minutes (0 = disabled)
  stats-logging-interval: ${EVENT_DB_STATS_INTERVAL:0}
  # Whether to log slow queries
  log-slow-queries: ${EVENT_DB_LOG_SLOW_QUERIES:false}
  # Threshold for slow query logging in milliseconds
  slow-query-threshold: ${EVENT_DB_SLOW_QUERY_THRESHOLD:1000}