# Event Service Test Environment Configuration
# This file contains environment-specific configuration properties for Event Service tests
# These settings are used to configure different test environments (local, CI, staging)

# ----------------------------------------
# Environment Detection and Auto-Configuration
# ----------------------------------------

# Automatically detect environment based on environment variables
# If TEST_ENV is not set, defaults to 'local'
test.environment=${TEST_ENV:local}

# ----------------------------------------
# Common Test Settings (All Environments)
# ----------------------------------------

# Test isolation settings to prevent affecting production systems
test.isolation.enabled=true

# Test data cleanup settings
test.cleanup.after.test=true

# Test timeout settings (in seconds)
test.timeout.default=30
test.timeout.integration=120

# ----------------------------------------
# Local Development Environment Settings
# ----------------------------------------

# Database connection settings for local environment
local.database.url=jdbc:h2:mem:event-test;DB_CLOSE_DELAY=-1
local.database.username=sa
local.database.password=
local.database.driver=org.h2.Driver

# Message broker settings for local environment
local.broker.type=embedded
local.broker.host=localhost
local.broker.port=5672
local.broker.username=guest
local.broker.password=guest
local.broker.virtual-host=/

# Service discovery settings for local environment
local.discovery.enabled=false
local.discovery.host=localhost
local.discovery.port=8500

# Local event processing settings
local.event.processing.threads=2
local.event.batch.size=100

# ----------------------------------------
# CI Environment Settings
# ----------------------------------------

# Database connection settings for CI environment
ci.database.url=jdbc:postgresql://postgres:5432/event_test
ci.database.username=test
ci.database.password=test
ci.database.driver=org.postgresql.Driver

# Message broker settings for CI environment
ci.broker.type=rabbitmq
ci.broker.host=rabbitmq
ci.broker.port=5672
ci.broker.username=test
ci.broker.password=test
ci.broker.virtual-host=/

# Service discovery settings for CI environment
ci.discovery.enabled=true
ci.discovery.host=consul
ci.discovery.port=8500

# CI event processing settings
ci.event.processing.threads=4
ci.event.batch.size=200

# ----------------------------------------
# Staging Environment Settings
# ----------------------------------------

# Database connection settings for staging environment
staging.database.url=jdbc:postgresql://event-db.staging:5432/event_service
staging.database.username=${STAGING_DB_USERNAME}
staging.database.password=${STAGING_DB_PASSWORD}
staging.database.driver=org.postgresql.Driver

# Message broker settings for staging environment
staging.broker.type=rabbitmq
staging.broker.host=rabbitmq.staging
staging.broker.port=5672
staging.broker.username=${STAGING_BROKER_USERNAME}
staging.broker.password=${STAGING_BROKER_PASSWORD}
staging.broker.virtual-host=/

# Service discovery settings for staging environment
staging.discovery.enabled=true
staging.discovery.host=consul.staging
staging.discovery.port=8500

# Staging event processing settings
staging.event.processing.threads=8
staging.event.batch.size=500

# ----------------------------------------
# Test Fixtures and Resources
# ----------------------------------------

# Path to test fixtures for event testing
test.fixtures.path=src/test/resources/fixtures

# Mock service endpoints for integration testing
test.mock.position-service.url=http://localhost:8081
test.mock.notification-service.url=http://localhost:8082

# Test event rules configuration
test.event.rules.config=src/test/resources/config/test-event-rules.json

# ----------------------------------------
# Test Observability Settings
# ----------------------------------------

# Test logging settings
test.logging.level=INFO
test.logging.console.enabled=true
test.logging.file.enabled=false

# Test metrics collection
test.metrics.enabled=false
test.metrics.export.console=true

# Test tracing settings
test.tracing.enabled=false
test.tracing.exporter=jaeger
test.tracing.endpoint=http://localhost:14250