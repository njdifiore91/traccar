# Event Service Integration Test Configuration

# =============================================================================
# Database Configuration
# =============================================================================
database.driver=org.postgresql.Driver
database.url=jdbc:postgresql://localhost:5432/traccar_test
database.username=test
database.password=test

# Hibernate/JPA Configuration
hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
hibernate.show_sql=true
hibernate.format_sql=true
hibernate.hbm2ddl.auto=create-drop

# =============================================================================
# Message Broker Configuration (Kafka)
# =============================================================================
# Kafka Connection
kafka.bootstrap.servers=localhost:9092
kafka.client.id=event-service-integration-test

# Consumer Configuration
kafka.consumer.group.id=event-service-integration-test-group
kafka.consumer.auto.offset.reset=earliest
kafka.consumer.enable.auto.commit=false

# Producer Configuration
kafka.producer.acks=all
kafka.producer.retries=3
kafka.producer.batch.size=16384
kafka.producer.linger.ms=1
kafka.producer.buffer.memory=33554432

# Topic Configuration
kafka.topic.positions=positions
kafka.topic.events=events
kafka.topic.notifications=notifications
kafka.topic.commands=commands

# =============================================================================
# Service Discovery Configuration (Consul)
# =============================================================================
service.discovery.enabled=true
service.discovery.implementation=consul
service.discovery.consul.host=localhost
service.discovery.consul.port=8500
service.discovery.service.name=event-service
service.discovery.service.port=8082
service.discovery.service.healthCheckPath=/actuator/health
service.discovery.service.healthCheckInterval=10s

# =============================================================================
# Mock Service Endpoints
# =============================================================================
# Position Service Mock
service.position.url=http://localhost:8081
service.position.api.path=/api/v1/positions
service.position.mock.enabled=true
service.position.mock.port=8081

# Notification Service Mock
service.notification.url=http://localhost:8083
service.notification.api.path=/api/v1/notifications
service.notification.mock.enabled=true
service.notification.mock.port=8083

# =============================================================================
# Test Configuration
# =============================================================================
# Test Timeouts
test.timeout.default=30000
test.timeout.startup=60000
test.timeout.shutdown=30000

# Test Data
test.device.id=1
test.device.uniqueId=test-device-123
test.geofence.id=1
test.user.id=1
test.user.email=test@example.com

# Test Event Configuration
test.event.processing.enabled=true
test.event.types.enabled=deviceOnline,deviceOffline,deviceMoving,deviceStopped,geofenceEnter,geofenceExit,overspeed,alarm

# =============================================================================
# Integration Test Specific Settings
# =============================================================================
# Enable/disable specific integration test features
integration.test.message.broker.enabled=true
integration.test.service.discovery.enabled=true
integration.test.database.enabled=true
integration.test.mock.services.enabled=true

# Testcontainers configuration
testcontainers.reuse.enable=true
testcontainers.kafka.image=confluentinc/cp-kafka:7.3.0
testcontainers.postgres.image=postgres:14-alpine
testcontainers.consul.image=consul:1.15

# WireMock configuration for service mocking
wiremock.position.service.port=8081
wiremock.notification.service.port=8083

# Test event data paths
test.event.data.path=src/test/resources/fixtures/events
test.position.data.path=src/test/resources/fixtures/positions

# Distributed tracing for integration tests
tracing.enabled=true
tracing.service.name=event-service-integration-test
tracing.sampler.probability=1.0