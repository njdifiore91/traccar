# Event Service Contract Test Configuration

# =============================================================================
# Contract Test Framework Configuration
# =============================================================================
# General contract test settings
contracts.test.enabled=true
contracts.test.mode=FULL
contracts.test.failOnError=true
contracts.test.timeout=30000

# Pact broker configuration
pact.broker.url=http://localhost:9292
pact.broker.auth.username=pactuser
pact.broker.auth.password=pactpassword
pact.provider.version=${project.version}
pact.provider.tag=${pact.provider.tag:test}

# =============================================================================
# Consumer Contract Configuration (Position Service -> Event Service)
# =============================================================================
# Position Service contract verification
contracts.consumer.position-service.enabled=true
contracts.consumer.position-service.contract.location=src/test/resources/contracts/position-service-consumer-contract.json
contracts.consumer.position-service.base-url=http://localhost:8081
contracts.consumer.position-service.provider-name=position-service

# Position Service message broker contract verification
contracts.consumer.position-service.broker.enabled=true
contracts.consumer.position-service.broker.type=kafka
contracts.consumer.position-service.broker.positions-topic=positions
contracts.consumer.position-service.broker.events-topic=position-events
contracts.consumer.position-service.broker.bootstrap-servers=localhost:9092

# Position Service contract state handlers
contracts.consumer.position-service.state.handlers.package=org.traccar.contracts.consumer.position
contracts.consumer.position-service.state.handlers.scan=true

# =============================================================================
# Producer Contract Configuration (Event Service -> Notification Service)
# =============================================================================
# Notification Service contract verification
contracts.producer.notification-service.enabled=true
contracts.producer.notification-service.contract.location=src/test/resources/contracts/notification-service-producer-contract.json
contracts.producer.notification-service.base-url=http://localhost:8083
contracts.producer.notification-service.consumer-name=notification-service

# Notification Service message broker contract verification
contracts.producer.notification-service.broker.enabled=true
contracts.producer.notification-service.broker.type=kafka
contracts.producer.notification-service.broker.notifications-topic=notifications
contracts.producer.notification-service.broker.bootstrap-servers=localhost:9092

# Notification Service contract state handlers
contracts.producer.notification-service.state.handlers.package=org.traccar.contracts.producer.notification
contracts.producer.notification-service.state.handlers.scan=true

# =============================================================================
# REST API Contract Configuration
# =============================================================================
# Event Service REST API contract verification
contracts.api.rest.enabled=true
contracts.api.rest.contract.location=src/test/resources/contracts/event-service-rest-contract.json
contracts.api.rest.base-url=http://localhost:8082
contracts.api.rest.context-path=/api

# =============================================================================
# gRPC Contract Configuration
# =============================================================================
# Event Service gRPC contract verification
contracts.api.grpc.enabled=true
contracts.api.grpc.contract.location=src/test/resources/contracts/event-service-grpc-contract.proto
contracts.api.grpc.host=localhost
contracts.api.grpc.port=9082

# =============================================================================
# Schema Validation Configuration
# =============================================================================
# JSON Schema validation for REST payloads
schema.validation.json.enabled=true
schema.validation.json.location=src/test/resources/schemas/json

# Protocol Buffers schema validation for gRPC
schema.validation.protobuf.enabled=true
schema.validation.protobuf.location=src/test/resources/schemas/protobuf

# Avro schema validation for message broker
schema.validation.avro.enabled=true
schema.validation.avro.location=src/test/resources/schemas/avro

# =============================================================================
# Mock Service Configuration for Contract Tests
# =============================================================================
# Position Service mock for consumer tests
mock.position-service.enabled=true
mock.position-service.port=8081
mock.position-service.host=localhost

# Notification Service mock for producer tests
mock.notification-service.enabled=true
mock.notification-service.port=8083
mock.notification-service.host=localhost

# Message broker mock
mock.message-broker.enabled=true
mock.message-broker.type=embedded-kafka
mock.message-broker.port=9092

# =============================================================================
# Contract Test Data Configuration
# =============================================================================
# Test data paths for contract tests
contracts.test.data.positions=src/test/resources/fixtures/positions
contracts.test.data.events=src/test/resources/fixtures/events
contracts.test.data.notifications=src/test/resources/fixtures/notifications

# Test device data
contracts.test.device.id=1
contracts.test.device.uniqueId=test-device-123

# Test event data
contracts.test.event.types=deviceMoving,deviceStopped,geofenceEnter,geofenceExit,deviceOverspeed,alarm,deviceOnline,deviceOffline,commandResult