# Feature Flags Configuration for Event Service Testing
# This file contains feature flag settings specific to Event Service testing environment

# ========================================================================
# Event Detection Algorithm Toggles
# ========================================================================

# Enable/disable experimental motion detection algorithm
# Uses machine learning to improve accuracy of motion state detection
feature.experimental.motion-detection.enabled=true

# Enable/disable enhanced geofence detection with predictive boundary crossing
feature.experimental.geofence-prediction.enabled=true

# Enable/disable advanced overspeed detection with road speed limits integration
feature.experimental.overspeed-detection.enabled=true

# Enable/disable AI-based driver behavior analysis
feature.experimental.driver-behavior-analysis.enabled=false

# Enable/disable enhanced trip detection with automatic stop detection
feature.experimental.enhanced-trip-detection.enabled=true

# ========================================================================
# Rule Evaluation Strategy Flags
# ========================================================================

# Rule evaluation strategy: 'sequential', 'parallel', or 'hybrid'
# - sequential: Evaluate rules one after another (legacy approach)
# - parallel: Evaluate rules in parallel using thread pool
# - hybrid: Use parallel for independent rules, sequential for dependent rules
feature.rule-evaluation.strategy=parallel

# Maximum number of threads to use for parallel rule evaluation
feature.rule-evaluation.max-threads=4

# Enable/disable rule caching to improve performance
feature.rule-evaluation.caching.enabled=true

# Cache expiration time in seconds
feature.rule-evaluation.caching.expiration-seconds=60

# Enable/disable rule dependency analysis for optimization
feature.rule-evaluation.dependency-analysis.enabled=true

# ========================================================================
# Event Processing Flags
# ========================================================================

# Enable/disable event deduplication
feature.event-processing.deduplication.enabled=true

# Deduplication window in milliseconds
feature.event-processing.deduplication.window-ms=5000

# Enable/disable event batching for processing
feature.event-processing.batching.enabled=true

# Maximum batch size for event processing
feature.event-processing.batching.max-size=100

# Maximum batch wait time in milliseconds
feature.event-processing.batching.max-wait-ms=200

# Enable/disable event prioritization
feature.event-processing.prioritization.enabled=true

# ========================================================================
# Message Broker Integration Flags
# ========================================================================

# Enable/disable message broker integration for event publishing
feature.message-broker.enabled=true

# Enable/disable dead letter queue for failed event processing
feature.message-broker.dlq.enabled=true

# Enable/disable message persistence for reliability testing
feature.message-broker.persistence.enabled=true

# Enable/disable message compression
feature.message-broker.compression.enabled=false

# ========================================================================
# Gradual Rollout Simulation Settings
# ========================================================================

# Enable/disable gradual rollout simulation
feature.gradual-rollout.enabled=true

# Percentage of events to process with new algorithm (0-100)
feature.gradual-rollout.percentage=50

# User IDs to always include in new feature rollout (comma-separated)
feature.gradual-rollout.always-include-users=admin,test-user

# Device IDs to always include in new feature rollout (comma-separated)
feature.gradual-rollout.always-include-devices=1,2,3

# ========================================================================
# Testing-Specific Parameters
# ========================================================================

# Enable/disable mock notification service for testing
feature.testing.mock-notification-service.enabled=true

# Enable/disable mock position service for testing
feature.testing.mock-position-service.enabled=true

# Enable/disable deterministic event generation for testing
feature.testing.deterministic-events.enabled=true

# Enable/disable event verification mode for testing
feature.testing.event-verification.enabled=true

# Enable/disable performance testing mode
feature.testing.performance-mode.enabled=false

# ========================================================================
# Circuit Breaker and Resilience Settings
# ========================================================================

# Enable/disable circuit breaker for external service calls
feature.resilience.circuit-breaker.enabled=true

# Enable/disable retry mechanism for failed operations
feature.resilience.retry.enabled=true

# Maximum number of retries for failed operations
feature.resilience.retry.max-attempts=3

# Enable/disable timeout for external service calls
feature.resilience.timeout.enabled=true

# Timeout duration in milliseconds
feature.resilience.timeout.duration-ms=5000

# ========================================================================
# Distributed Tracing Settings
# ========================================================================

# Enable/disable distributed tracing for event processing
feature.tracing.enabled=true

# Sampling rate for tracing (0.0-1.0)
feature.tracing.sampling-rate=1.0

# Enable/disable span exporting to tracing backend
feature.tracing.span-export.enabled=true

# Enable/disable MDC context propagation
feature.tracing.mdc-propagation.enabled=true