# ===================================================================
# EVENT SERVICE TEST CONFIGURATION PROPERTIES
# ===================================================================
# This file contains test-specific configuration for the Event Service
# It overrides default settings for testing event detection and processing

# ===================================================================
# GENERAL SERVICE CONFIGURATION
# ===================================================================

# Service identification for test environment
service.name=event-service
service.instance.id=test-instance
service.version=1.0.0-TEST

# Test environment settings
spring.profiles.active=test
server.port=0

# ===================================================================
# MESSAGE BROKER CONFIGURATION
# ===================================================================

# Kafka configuration for tests (using test-specific topics)
message.broker.type=kafka
kafka.bootstrap.servers=localhost:9092
kafka.consumer.group.id=event-service-test-group

# Test-specific topic names to avoid conflicts with other environments
kafka.topic.positions=test-positions
kafka.topic.events=test-events
kafka.topic.notifications=test-notifications
kafka.topic.dead-letter-queue=test-dlq

# Alternative RabbitMQ configuration (commented out by default)
#message.broker.type=rabbitmq
#rabbitmq.host=localhost
#rabbitmq.port=5672
#rabbitmq.username=guest
#rabbitmq.password=guest
#rabbitmq.exchange=test-exchange
#rabbitmq.queue.positions=test-positions
#rabbitmq.queue.events=test-events
#rabbitmq.queue.notifications=test-notifications
#rabbitmq.queue.dead-letter=test-dlq

# ===================================================================
# EVENT DETECTION THRESHOLDS
# ===================================================================

# Motion event detection thresholds
event.motion.distance.threshold=500
event.motion.min.period=300000
event.motion.max.period=300000
event.motion.speed.threshold=0
event.motion.use.ignition=false
event.motion.process.invalid.positions=false

# Overspeed event detection thresholds
event.overspeed.threshold.default=90
event.overspeed.threshold.tolerance=5
event.overspeed.minimum.duration=15000

# Geofence event detection settings
event.geofence.awareness.radius=100
event.geofence.min.points=3
event.geofence.process.invalid.positions=false

# Ignition event detection settings
event.ignition.detect.from.attributes=true
event.ignition.attribute.name=ignition

# Idle event detection settings
event.idle.duration.threshold=180000
event.idle.speed.threshold=1
event.idle.use.ignition=true

# Acceleration event detection settings
event.acceleration.threshold=10
event.acceleration.min.speed=20

# Braking event detection settings
event.braking.threshold=10
event.braking.min.speed=20

# ===================================================================
# RULE EVALUATION PARAMETERS
# ===================================================================

# Rule engine configuration
rule.engine.type=drools
rule.evaluation.mode=sequential
rule.max.execution.time=1000

# Rule priorities (lower number = higher priority)
rule.priority.geofence=10
rule.priority.overspeed=20
rule.priority.motion=30
rule.priority.ignition=40
rule.priority.idle=50
rule.priority.acceleration=60
rule.priority.braking=70

# Rule execution tracing for tests
rule.execution.trace.enabled=true
rule.execution.trace.level=FULL

# ===================================================================
# EVENT PROCESSING AND FILTERING
# ===================================================================

# Event processing configuration
event.processing.thread.pool.size=10
event.processing.queue.capacity=1000
event.processing.batch.size=100
event.processing.max.retry.attempts=3

# Event filtering settings
event.filter.duplicate.window=60000
event.filter.min.distance=0
event.filter.min.time.interval=0
event.filter.invalid.positions=true

# Event aggregation settings
event.aggregation.enabled=true
event.aggregation.window=60000
event.aggregation.max.events=10

# ===================================================================
# EVENT NOTIFICATION TRIGGER SETTINGS
# ===================================================================

# Notification trigger configuration
notification.trigger.enabled=true
notification.trigger.async=true
notification.trigger.batch.size=50
notification.trigger.max.delay=5000

# Notification channel selection for tests
notification.channels.enabled=web,email
notification.channels.disabled=sms,push,telegram

# ===================================================================
# CIRCUIT BREAKER AND RETRY POLICY
# ===================================================================

# Circuit breaker configuration
circuit.breaker.enabled=true
circuit.breaker.failure.threshold=5
circuit.breaker.reset.timeout=30000
circuit.breaker.half.open.calls=3

# Retry policy configuration
retry.policy.enabled=true
retry.policy.max.attempts=3
retry.policy.initial.delay=1000
retry.policy.multiplier=2.0
retry.policy.max.delay=10000

# ===================================================================
# TEST-SPECIFIC OVERRIDES
# ===================================================================

# Database configuration for tests
database.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
database.username=sa
database.password=
database.driver=org.h2.Driver

# Service discovery for tests
service.discovery.enabled=false
service.discovery.test.mode=true

# Logging configuration for tests
logging.level.org.traccar=DEBUG
logging.level.org.traccar.event=TRACE

# Test data configuration
test.data.device.count=10
test.data.position.count=100
test.data.event.count=20

# Test timeouts
test.timeout.default=10000
test.timeout.integration=30000