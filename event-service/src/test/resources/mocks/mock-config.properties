# =========================================================================
# Event Service Mock Configuration
# =========================================================================
# This file contains configuration for all mock services used in Event Service tests.
# It defines global settings, default behaviors, and common parameters for test mocks.

# =========================================================================
# Global Mock Settings
# =========================================================================

# Global timeout settings (in milliseconds)
mock.global.timeout.connect=500
mock.global.timeout.read=1000
mock.global.timeout.request=2000

# Global retry settings
mock.global.retry.maxAttempts=3
mock.global.retry.initialBackoff=100
mock.global.retry.maxBackoff=1000
mock.global.retry.backoffMultiplier=2.0

# Default response delay (in milliseconds) to simulate network latency
mock.global.response.delay=50

# Default error rate (percentage) to simulate occasional failures
mock.global.error.rate=0

# =========================================================================
# Service Discovery Mock
# =========================================================================

# Mock service discovery configuration
mock.discovery.enabled=true
mock.discovery.host=localhost
mock.discovery.port=8500

# Predefined service endpoints for testing
mock.discovery.service.protocol=http://localhost:8091
mock.discovery.service.position=http://localhost:8092
mock.discovery.service.notification=http://localhost:8093
mock.discovery.service.geocoding=http://localhost:8094
mock.discovery.service.speedlimit=http://localhost:8095
mock.discovery.service.authentication=http://localhost:8096

# =========================================================================
# Message Broker Mock
# =========================================================================

# Mock message broker configuration
mock.broker.enabled=true
mock.broker.type=kafka
mock.broker.host=localhost
mock.broker.port=9092

# Topic configuration
mock.broker.topic.enriched-positions=test-enriched-positions
mock.broker.topic.events=test-events
mock.broker.topic.notifications=test-notifications

# Consumer group configuration
mock.broker.consumer.group.id=event-service-test
mock.broker.consumer.auto.offset.reset=earliest

# Dead letter queue configuration
mock.broker.dlq.enabled=true
mock.broker.dlq.topic.prefix=test-dlq-

# =========================================================================
# Position Service Mock
# =========================================================================

# Mock position service configuration
mock.position.enabled=true
mock.position.url=${mock.discovery.service.position}/api/positions
mock.position.timeout=1000

# Default position responses
mock.position.default.latitude=0.0
mock.position.default.longitude=0.0
mock.position.default.speed=0.0
mock.position.default.course=0.0
mock.position.default.altitude=0.0
mock.position.default.accuracy=0.0

# Position history configuration
mock.position.history.enabled=true
mock.position.history.size=10

# =========================================================================
# Notification Service Mock
# =========================================================================

# Mock notification service configuration
mock.notification.enabled=true
mock.notification.url=${mock.discovery.service.notification}/api/notifications
mock.notification.timeout=1000

# Default notification responses
mock.notification.default.success=true
mock.notification.default.deliveryStatus=SENT

# Notification channels configuration
mock.notification.channels.email=true
mock.notification.channels.sms=true
mock.notification.channels.push=true
mock.notification.channels.web=true

# =========================================================================
# Database Mock
# =========================================================================

# Mock database configuration
mock.database.enabled=true
mock.database.type=h2
mock.database.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
mock.database.username=sa
mock.database.password=
mock.database.driver=org.h2.Driver

# =========================================================================
# Authentication Service Mock
# =========================================================================

# Mock authentication service configuration
mock.authentication.enabled=true
mock.authentication.url=${mock.discovery.service.authentication}/api/auth
mock.authentication.timeout=500

# Default authentication responses
mock.authentication.default.authenticated=true
mock.authentication.default.userId=1
mock.authentication.default.roles=ROLE_USER,ROLE_ADMIN

# =========================================================================
# Geofence Configuration Mock
# =========================================================================

# Mock geofence configuration
mock.geofence.enabled=true

# Default geofence responses
mock.geofence.default.inside=false
mock.geofence.default.distance=0.0

# Predefined test geofences
mock.geofence.test.circular.latitude=0.0
mock.geofence.test.circular.longitude=0.0
mock.geofence.test.circular.radius=100.0
mock.geofence.test.polygon.points=0.0,0.0,0.0,1.0,1.0,1.0,1.0,0.0

# =========================================================================
# Event Rule Configuration Mock
# =========================================================================

# Mock event rule configuration
mock.eventrule.enabled=true

# Default event rule responses
mock.eventrule.default.triggered=false

# Predefined test rules
mock.eventrule.test.geofence.id=1
mock.eventrule.test.geofence.type=geofenceEnter
mock.eventrule.test.geofence.name=Test Geofence

mock.eventrule.test.overspeed.id=2
mock.eventrule.test.overspeed.type=deviceOverspeed
mock.eventrule.test.overspeed.threshold=80.0
mock.eventrule.test.overspeed.name=Speed Limit

mock.eventrule.test.motion.id=3
mock.eventrule.test.motion.type=deviceMoving
mock.eventrule.test.motion.name=Motion Detection

mock.eventrule.test.stationary.id=4
mock.eventrule.test.stationary.type=deviceStopped
mock.eventrule.test.stationary.name=Vehicle Stopped

mock.eventrule.test.ignition.id=5
mock.eventrule.test.ignition.type=ignitionOn
mock.eventrule.test.ignition.name=Ignition Status

mock.eventrule.test.alarm.id=6
mock.eventrule.test.alarm.type=alarm
mock.eventrule.test.alarm.name=Device Alarm

mock.eventrule.test.maintenance.id=7
mock.eventrule.test.maintenance.type=maintenance
mock.eventrule.test.maintenance.name=Maintenance Due
mock.eventrule.test.maintenance.threshold=10000

# Event rule evaluation configuration
mock.eventrule.evaluation.stateful=true
mock.eventrule.evaluation.windowSize=60000
mock.eventrule.evaluation.batchSize=100

# =========================================================================
# Event Processing Configuration
# =========================================================================

# Mock event processing configuration
mock.eventprocessing.enabled=true

# Event processing parameters
mock.eventprocessing.batchSize=100
mock.eventprocessing.maxDelay=1000
mock.eventprocessing.concurrentProcessors=2

# Event types to process
mock.eventprocessing.types.geofence=true
mock.eventprocessing.types.overspeed=true
mock.eventprocessing.types.motion=true
mock.eventprocessing.types.stationary=true
mock.eventprocessing.types.ignition=true
mock.eventprocessing.types.alarm=true
mock.eventprocessing.types.maintenance=true

# Event priority configuration (higher number = higher priority)
mock.eventprocessing.priority.alarm=100
mock.eventprocessing.priority.geofence=80
mock.eventprocessing.priority.overspeed=70
mock.eventprocessing.priority.ignition=60
mock.eventprocessing.priority.motion=50
mock.eventprocessing.priority.stationary=40
mock.eventprocessing.priority.maintenance=30

# =========================================================================
# State Management Mock
# =========================================================================

# Mock state management configuration
mock.state.enabled=true

# State storage configuration
mock.state.storage.type=memory
mock.state.storage.persistence=false

# State expiration configuration
mock.state.expiration.enabled=true
mock.state.expiration.timeToLive=86400000

# Device state configuration
mock.state.device.motion=stationary
mock.state.device.ignition=off
mock.state.device.online=true

# Geofence state configuration
mock.state.geofence.inside=false

# =========================================================================
# Circuit Breaker Mock
# =========================================================================

# Mock circuit breaker configuration
mock.circuitbreaker.enabled=true
mock.circuitbreaker.failureThreshold=50
mock.circuitbreaker.resetTimeout=30000

# Service-specific circuit breaker settings
mock.circuitbreaker.position.enabled=true
mock.circuitbreaker.position.failureThreshold=50
mock.circuitbreaker.notification.enabled=true
mock.circuitbreaker.notification.failureThreshold=50

# =========================================================================
# Event Handler Configuration
# =========================================================================

# Mock event handler configuration
mock.eventhandler.enabled=true

# Event handler types
mock.eventhandler.geofence.enabled=true
mock.eventhandler.overspeed.enabled=true
mock.eventhandler.motion.enabled=true
mock.eventhandler.ignition.enabled=true
mock.eventhandler.alarm.enabled=true
mock.eventhandler.maintenance.enabled=true

# Event handler parameters
mock.eventhandler.geofence.minDistance=10.0
mock.eventhandler.overspeed.hysteresis=5.0
mock.eventhandler.motion.minSpeed=5.0
mock.eventhandler.motion.minDistance=50.0
mock.eventhandler.ignition.detectFromSpeed=false
mock.eventhandler.maintenance.reminderInterval=86400000

# =========================================================================
# Test Scenario Configuration
# =========================================================================

# Mock test scenario configuration
mock.scenario.enabled=true

# Geofence scenarios
mock.scenario.geofence.enter.enabled=true
mock.scenario.geofence.enter.latitude=1.0
mock.scenario.geofence.enter.longitude=1.0
mock.scenario.geofence.enter.geofenceId=1

mock.scenario.geofence.exit.enabled=true
mock.scenario.geofence.exit.latitude=10.0
mock.scenario.geofence.exit.longitude=10.0
mock.scenario.geofence.exit.geofenceId=1

# Overspeed scenarios
mock.scenario.overspeed.start.enabled=true
mock.scenario.overspeed.start.speed=90.0
mock.scenario.overspeed.start.speedLimit=80.0

mock.scenario.overspeed.end.enabled=true
mock.scenario.overspeed.end.speed=70.0
mock.scenario.overspeed.end.speedLimit=80.0

# Motion scenarios
mock.scenario.motion.start.enabled=true
mock.scenario.motion.start.speed=10.0
mock.scenario.motion.start.previousSpeed=0.0

mock.scenario.motion.end.enabled=true
mock.scenario.motion.end.speed=0.0
mock.scenario.motion.end.previousSpeed=10.0

# Ignition scenarios
mock.scenario.ignition.on.enabled=true
mock.scenario.ignition.on.ignition=true
mock.scenario.ignition.on.previousIgnition=false

mock.scenario.ignition.off.enabled=true
mock.scenario.ignition.off.ignition=false
mock.scenario.ignition.off.previousIgnition=true

# Alarm scenarios
mock.scenario.alarm.triggered.enabled=true
mock.scenario.alarm.triggered.alarmType=sos

